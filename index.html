<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>SafeRoute – Đi an toàn hơn mỗi ngày</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/main.css">
<link rel="stylesheet" href="./css/responsive.css">
</head>
<body>

<div id="app">

  <!-- ============================================================ HEADER -->
  <header id="header">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-shield-halved"></i></div>
      <div class="brand-text">
        <div class="name">Safe<span>Route</span></div>
        <div class="tagline">Đi an toàn hơn mỗi ngày</div>
      </div>
    </div>
    <button class="account-btn">
      <span class="avatar"><i class="fa-solid fa-user"></i></span>
      <span class="account-label">Đăng nhập</span>
    </button>
  </header>

  <div id="main-content">

    <!-- ============================================================ SIDEBAR -->
    <aside id="sidebar">
      <div class="sheet-handle" onclick="toggleSheet()"><span></span></div>

      <p class="panel-title">TÌM ĐƯỜNG</p>
      <div class="search-card">
        <div class="location-row">

          <!-- Điểm bắt đầu — autocomplete Nominatim + GPS -->
          <div class="location-field start" id="start-field">
            <i class="fa-solid fa-location-dot"></i>
            <input id="start-input" type="text" placeholder="Điểm bắt đầu"
              value="Chợ Bến Thành" autocomplete="off"
              role="combobox" aria-autocomplete="list"
              aria-expanded="false" aria-controls="start-suggestions" />
            <button type="button" id="gps-btn" class="location-action-btn"
              title="Sử dụng vị trí hiện tại" aria-label="Sử dụng vị trí hiện tại">
              <i class="fa-solid fa-location-crosshairs"></i>
            </button>
            <ul id="start-suggestions" class="suggestions-dropdown hidden"
              role="listbox" aria-label="Gợi ý điểm bắt đầu"></ul>
          </div>

          <!-- Điểm đến — autocomplete Nominatim tương tự -->
          <div class="location-field end" id="end-field">
            <i class="fa-solid fa-flag-checkered"></i>
            <input id="end-input" type="text" placeholder="Điểm đến"
              autocomplete="off" role="combobox" aria-autocomplete="list"
              aria-expanded="false" aria-controls="end-suggestions" />
            <ul id="end-suggestions" class="suggestions-dropdown hidden"
              role="listbox" aria-label="Gợi ý điểm đến"></ul>
          </div>

          <button class="swap-btn" onclick="swapLocations()" title="Đảo chiều">
            <i class="fa-solid fa-arrow-up-arrow-down"></i>
          </button>
        </div>

        <!-- Chế độ: alpha quyết định weight = dist*(1 + alpha*risk) -->
        <div class="mode-group" id="mode-group">
          <label class="mode-option" data-mode="fastest">
            <input type="radio" name="mode" value="fastest" />
            <span class="mode-label">Nhanh nhất</span>
            <span class="mode-sub">α = 0</span>
          </label>
          <label class="mode-option checked" data-mode="balanced">
            <input type="radio" name="mode" value="balanced" checked />
            <span class="mode-label">Cân bằng</span>
            <span class="mode-sub">α = 1</span>
          </label>
          <label class="mode-option" data-mode="safest">
            <input type="radio" name="mode" value="safest" />
            <span class="mode-label">An toàn nhất</span>
            <span class="mode-sub">α = 3</span>

        </div>

        <button class="find-btn" id="find-btn" onclick="onFindRouteClick()">
          <i class="fa-solid fa-route"></i>

        </button>
      </div>

      <div id="route-results"></div>
    </aside>

    <!-- ============================================================ MAP -->
    <div id="map-container">

        <div class="legend-item"><span class="dot" style="background:var(--risk-mid)"></span>Rủi ro trung bình</div>
        <div class="legend-item"><span class="dot" style="background:var(--risk-high)"></span>Rủi ro cao</div>
      </div>

      <div id="nearby-panel">

        <div id="nearby-list"></div>

      </button>

</div>

<!-- ============================================================ MODAL BÁO CÁO SỰ CỐ -->
<div class="modal-overlay hidden" id="report-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Báo cáo sự cố</h3>
      <button class="modal-close" onclick="closeReportModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="field-group">
      <label>Loại sự cố</label>
      <select id="report-type">
        <option value="flood">🔵 Ngập nước</option>
        <option value="accident">🔴 Tai nạn giao thông</option>
        <option value="construction">🟠 Công trình đang thi công</option>
        <option value="traffic">🟡 Ùn tắc</option>
        <option value="damaged_road">🟤 Đường hư hỏng</option>
        <option value="danger">⚠️ Khu vực nguy hiểm</option>
        <option value="obstacle">🟣 Chướng ngại vật</option>

    </div>

    <div class="field-group">
      <label>Mức độ</label>
      <div class="level-group" id="level-group">

<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toast-text"></span></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ================================================================
   SAFEROUTE — ROUTING THẬT (OSRM) + CONFIDENCE DECAY
   ----------------------------------------------------------------
   Kiến trúc:
   1. Autocomplete Nominatim (start & end) với debounce 400ms
   2. OSRM routing API → polyline theo đường giao thông thật
   3. Risk score từ khoảng cách incident đến route (Haversine)
   4. Báo cáo sự cố qua mini map riêng (Leaflet instance độc lập)
   5. Confidence = 50% khi tạo mới, tăng khi có người báo thêm
   6. Decay theo half-life riêng cho từng loại sự cố
   7. Incident biến mất khi confidence → 0

   Về Backend:
   Hiện tại là frontend demo (mảng local). Để deploy thật, thay
   addOrConfirmIncident() bằng POST /api/incidents và GET /api/incidents
   từ server — server sẽ là nguồn sự thật duy nhất về confidence,
   reporterIds, decay, và persistence.
================================================================ */

/* ---------------------------------------------------------------
   DEMO USER ID — thay bằng user ID từ auth backend khi triển khai thật
   Dùng để tránh cùng 1 người spam +50% liên tục.
--------------------------------------------------------------- */
const DEMO_USER_ID = 'demo-user-' + Math.random().toString(36).slice(2, 9);

/* ---------------------------------------------------------------
   CONSTANTS
--------------------------------------------------------------- */
// Ngưỡng khoảng cách để gộp incident (cùng loại, trong bán kính này)
const INCIDENT_MERGE_RADIUS_METERS = 100;

// Ngưỡng ảnh hưởng của incident đến risk score tuyến đường
const RISK_IMPACT = {
  STRONG_THRESHOLD_M: 100,   // < 100m → ảnh hưởng mạnh
  MEDIUM_THRESHOLD_M: 300,   // 100–300m → ảnh hưởng vừa
  STRONG_WEIGHT: 1.0,
  MEDIUM_WEIGHT: 0.4,
};

// Trọng số loại sự cố trong risk score
const INCIDENT_TYPE_WEIGHT = {
  accident: 0.30, flood: 0.25, danger: 0.20,
  construction: 0.15, traffic: 0.12,
  damaged_road: 0.10, obstacle: 0.08,
};

// Trọng số mức độ trong risk score
const INCIDENT_LEVEL_WEIGHT = { cao: 1.0, trungbinh: 0.5, thap: 0.2 };

// Half-life decay: thời gian để confidence giảm 50% (giờ)
const INCIDENT_DECAY_CONFIG = {
  flood:        { halfLifeHours: 3    },  // ngập nước → vài giờ
  accident:     { halfLifeHours: 1    },  // tai nạn → nhanh
  construction: { halfLifeHours: 72   },  // công trình → nhiều ngày
  traffic:      { halfLifeHours: 0.5  },  // ùn tắc → rất nhanh
  damaged_road: { halfLifeHours: 168  },  // đường hư → rất lâu
  danger:       { halfLifeHours: 168  },  // khu nguy hiểm → rất lâu
  obstacle:     { halfLifeHours: 6    },  // chướng ngại → vài giờ
};

// Màu polyline cho từng route index
const ROUTE_COLORS = ['#2f7ee0', '#f08a1c', '#12b76a', '#8a4fe0', '#e3492c'];

/* ---------------------------------------------------------------
   1. CẤU HÌNH LOẠI SỰ CỐ
--------------------------------------------------------------- */
const INCIDENT_TYPES = {
  accident:     { label: 'Tai nạn giao thông',       emoji: '🔴', color: '#e3492c' },
  flood:        { label: 'Ngập nước',                emoji: '🔵', color: '#2f7ee0' },
  construction: { label: 'Công trình đang thi công', emoji: '🟠', color: '#f08a1c' },
  traffic:      { label: 'Ùn tắc',                   emoji: '🟡', color: '#f4b400' },
  danger:       { label: 'Khu vực nguy hiểm',        emoji: '⚠️', color: '#8a4fe0' },
  damaged_road: { label: 'Đường hư hỏng',            emoji: '🟤', color: '#8d6e63' },
  obstacle:     { label: 'Chướng ngại vật',          emoji: '🟣', color: '#7c4dff' },
};
const LEVEL_LABEL = { thap: 'Thấp', trungbinh: 'Trung bình', cao: 'Cao' };

/* ---------------------------------------------------------------
   2. DỮ LIỆU DEMO SỰ CỐ — với timestamp thật + confidence
   (tương đương dữ liệu có thể lấy từ GET /api/incidents)
--------------------------------------------------------------- */
const NOW = Date.now();
let incidents = [
  {
    id: 'demo-1', type: 'flood', level: 'cao',
    lat: 10.7769, lng: 106.6982,
    desc: 'Nước ngập khoảng 30cm, xe máy khó di chuyển.',
    confidence: 100, reporterCount: 24,
    reporterIds: ['u1','u2','u3'],
    createdAt: NOW - 15*60*1000,
    lastConfirmedAt: NOW - 15*60*1000,
  },
  {
    id: 'demo-2', type: 'accident', level: 'cao',
    lat: 10.7891, lng: 106.7020,
    desc: 'Va chạm giữa 2 xe máy, đang chờ xử lý.',
    confidence: 100, reporterCount: 18,
    reporterIds: ['u1','u4'],
    createdAt: NOW - 32*60*1000,
    lastConfirmedAt: NOW - 32*60*1000,
  },
  {
    id: 'demo-3', type: 'construction', level: 'trungbinh',
    lat: 10.7820, lng: 106.6955,
    desc: 'Rào chắn thi công chiếm 1 làn đường.',
    confidence: 100, reporterCount: 9,
    reporterIds: ['u5'],
    createdAt: NOW - 2*60*60*1000,
    lastConfirmedAt: NOW - 2*60*60*1000,
  },
  {
    id: 'demo-4', type: 'traffic', level: 'trungbinh',
    lat: 10.7735, lng: 106.7050,
    desc: 'Ùn tắc kéo dài do giờ cao điểm.',
    confidence: 100, reporterCount: 31,
    reporterIds: ['u6','u7'],
    createdAt: NOW - 5*60*1000,
    lastConfirmedAt: NOW - 5*60*1000,
  },
  {
    id: 'demo-5', type: 'danger', level: 'cao',
    lat: 10.8010, lng: 106.7110,
    desc: 'Khu vực thường xuyên xảy ra cướp giật ban đêm.',
    confidence: 100, reporterCount: 14,
    reporterIds: ['u8'],
    createdAt: NOW - 24*60*60*1000,
    lastConfirmedAt: NOW - 24*60*60*1000,
  },
  {
    id: 'demo-6', type: 'damaged_road', level: 'thap',
    lat: 10.7690, lng: 106.6900,
    desc: 'Mặt đường có nhiều ổ gà.',
    confidence: 100, reporterCount: 7,
    reporterIds: ['u9'],
    createdAt: NOW - 3*60*60*1000,
    lastConfirmedAt: NOW - 3*60*60*1000,
  },
  {
    id: 'demo-7', type: 'flood', level: 'trungbinh',
    lat: 10.7940, lng: 106.6870,
    desc: 'Ngập cục bộ tại điểm trũng.',
    confidence: 100, reporterCount: 11,
    reporterIds: ['u10'],
    createdAt: NOW - 40*60*1000,
    lastConfirmedAt: NOW - 40*60*1000,
  },
  {
    id: 'demo-8', type: 'obstacle', level: 'thap',
    lat: 10.7660, lng: 106.7080,
    desc: 'Cây đổ chắn một phần lòng đường.',
    confidence: 100, reporterCount: 5,
    reporterIds: ['u11'],
    createdAt: NOW - 20*60*1000,
    lastConfirmedAt: NOW - 20*60*1000,
  },
];

/* ---------------------------------------------------------------
   3. TRẠNG THÁI CHUNG
--------------------------------------------------------------- */
let map, incidentLayerGroup, routeLayerGroup;
let selectedMode = 'balanced';

// Start / end
let startLocation = { lat: 10.7725, lng: 106.6980, label: 'Chợ Bến Thành', source: 'default' };
let endLocation = null;
let startMarker = null;
let endMarker = null;
let selectingStartOnMap = false;
let startSearchTimer = null;
let endSearchTimer = null;
let startSearchToken = 0;
let endSearchToken = 0;
let isFindingRoute = false;
let currentRoutes = [];

// Mini map báo cáo — hoàn toàn độc lập với bản đồ chính
let reportMap = null;
let reportMarker = null;
let reportMapInitialized = false;
let reportSelectedLatLng = null;  // tọa độ người dùng chọn trên mini map

/* ---------------------------------------------------------------
   4. UTILITY
--------------------------------------------------------------- */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
}

function shortenDisplayName(dn) {
  return String(dn).split(',').map(p => p.trim()).slice(0, 3).join(', ');
}

function isValidCoordinate(lat, lng) {
  return Number.isFinite(+lat) && Number.isFinite(+lng)
    && +lat >= -90 && +lat <= 90 && +lng >= -180 && +lng <= 180;
}

/** Khoảng cách Haversine (m) */
function haversineMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
// Alias đồng nhất với tên dùng trong addOrConfirmIncident
const distanceMeters = haversineMeters;

/** Tìm khoảng cách nhỏ nhất từ điểm đến polyline */
function minDistanceToPolyline(lat, lng, coords) {
  let min = Infinity;
  for (const c of coords) {
    const d = haversineMeters(lat, lng, c[0], c[1]);
    if (d < min) min = d;
  }
  return min;
}

/** Thời gian tương đối */
function formatRelativeTime(ts) {
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return 'Vừa xong';
  if (mins < 60) return `${mins} phút trước`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs} giờ trước`;
  return `${Math.floor(hrs / 24)} ngày trước`;
}

/* ---------------------------------------------------------------
   5. CONFIDENCE — decay và tính toán
--------------------------------------------------------------- */
/**
 * Tính confidence hiện tại của incident dựa trên thời gian thực.
 * Công thức: C(t) = C_last * 0.5^(elapsedHours / halfLife)
 * Lưu thời gian thay vì giảm theo timer → đúng kể cả khi đóng/mở lại trình duyệt.
 */
function calculateCurrentConfidence(incident, now = Date.now()) {
  const cfg = INCIDENT_DECAY_CONFIG[incident.type] ?? { halfLifeHours: 24 };
  const lastActivity = incident.lastConfirmedAt ?? incident.createdAt;
  const elapsedHours = (now - lastActivity) / (1000 * 60 * 60);
  const c = incident.confidence * Math.pow(0.5, elapsedHours / cfg.halfLifeHours);
  return Math.max(0, Math.min(100, c));
}

/** Màu confidence */
function getConfidenceColor(c) {
  if (c >= 70) return 'var(--risk-low)';
  if (c >= 40) return 'var(--risk-mid)';
  return 'var(--risk-high)';
}

/* ---------------------------------------------------------------
   6. CLEANUP INCIDENTS HẾT HẠN
--------------------------------------------------------------- */
function cleanupExpiredIncidents() {
  const now = Date.now();
  const before = incidents.length;
  incidents = incidents.filter(inc => {
    const c = calculateCurrentConfidence(inc, now);
    inc.confidence = c; // cập nhật vào object để render chính xác
    return c > 0.1;
  });
  if (incidents.length !== before) renderIncidents();
}

// Chạy định kỳ mỗi 60 giây
setInterval(cleanupExpiredIncidents, 60 * 1000);

/* ---------------------------------------------------------------
   7. addOrConfirmIncident — logic báo cáo và gộp
   Khi triển khai thật: thay bằng POST /api/incidents
--------------------------------------------------------------- */
function addOrConfirmIncident(data) {
  cleanupExpiredIncidents();

  // Tìm incident cùng loại, gần vị trí, còn sống
  const nearby = incidents.find(inc => {
    if (inc.type !== data.type) return false;
    const c = calculateCurrentConfidence(inc);
    if (c <= 0) return false;
    return distanceMeters(inc.lat, inc.lng, data.lat, data.lng) <= INCIDENT_MERGE_RADIUS_METERS;
  });

  if (nearby) {
    // Chống spam: không cộng nếu cùng user
    if (nearby.reporterIds && nearby.reporterIds.includes(DEMO_USER_ID)) {
      showToast('Bạn đã báo cáo sự cố này rồi.');
      return;
    }
    // Cộng +50% vào confidence hiện tại (sau decay)
    const currentC = calculateCurrentConfidence(nearby);
    nearby.confidence = Math.min(100, currentC + 50);
    nearby.lastConfirmedAt = Date.now();
    nearby.reporterCount = (nearby.reporterCount ?? 1) + 1;
    nearby.reporterIds = [...(nearby.reporterIds ?? []), DEMO_USER_ID];
    renderIncidents();
    showToast(`Đã xác nhận sự cố. Độ tin cậy: ${Math.round(nearby.confidence)}%`);
    return;
  }

  // Tạo incident mới — confidence bắt đầu 50%
  const newInc = {
    id: (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'inc-' + Date.now(),
    type: data.type,
    level: data.level,
    lat: data.lat,
    lng: data.lng,
    desc: data.desc,
    confidence: 50,
    reporterCount: 1,
    reporterIds: [DEMO_USER_ID],
    createdAt: Date.now(),
    lastConfirmedAt: Date.now(),
  };
  incidents.push(newInc);
  renderIncidents();
}

/* ---------------------------------------------------------------
   8. KHỞI TẠO BẢN ĐỒ CHÍNH
--------------------------------------------------------------- */
function initMap() {
  map = L.map('map', { zoomControl: false }).setView([10.7769, 106.7009], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; SafeRoute built by IzekNguyen', maxZoom: 19
  }).addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  incidentLayerGroup = L.layerGroup().addTo(map);
  routeLayerGroup = L.layerGroup().addTo(map);

  // Bản đồ chính: chỉ xử lý click để chọn điểm bắt đầu (chế độ selectingStartOnMap)
  // KHÔNG xử lý click báo cáo sự cố — modal dùng mini map riêng
  map.on('click', function (e) {
    if (selectingStartOnMap) { selectStartFromMap(e.latlng); }
  });

  renderIncidents();
  renderNearbyPanel();

  if (startLocation) updateStartMarker(startLocation.lat, startLocation.lng, startLocation.label);
  initStartLocationControls();
  initEndLocationControls();
}

/* ---------------------------------------------------------------
   9. MARKER ĐIỂM BẮT ĐẦU & ĐIỂM ĐẾN
--------------------------------------------------------------- */
function setStartLocation(lat, lng, label, source) {
  startLocation = { lat, lng, label, source };
  document.getElementById('start-input').value = label;
  updateStartMarker(lat, lng, label);
}

function updateStartMarker(lat, lng, label) {

/* ---------------------------------------------------------------
   12. ROUTING THẬT — OSRM API
   lng,lat (OSRM) → lat,lng (Leaflet)
--------------------------------------------------------------- */
async function findSafeRoutes(start, end) {
  const url = `https://router.project-osrm.org/route/v1/driving/` +
    `${start.lng},${start.lat};${end.lng},${end.lat}` +
    `?overview=full&geometries=geojson&steps=true&alternatives=true`;

  const res = await fetch(url);
  if (!res.ok) throw new Error('Routing API error');
  const data = await res.json();
  if (data.code !== 'Ok' || !data.routes?.length) throw new Error('Không tìm thấy tuyến đường');

  return data.routes.map((route, index) => ({
    id: String.fromCharCode(65 + index),
    coords: route.geometry.coordinates.map(([lng, lat]) => [lat, lng]),
    distance: route.distance / 1000,
    duration: route.duration / 60,
    legs: route.legs,
    routeIndex: index,
    riskScore: 0,
  }));
}

/* ---------------------------------------------------------------
   13. RISK SCORE từ incident thật gần route
--------------------------------------------------------------- */
function calculateRouteRisk(route) {
  let raw = 0;
  for (const inc of incidents) {
    const c = calculateCurrentConfidence(inc);
    if (c <= 0) continue;
    const distM = minDistanceToPolyline(inc.lat, inc.lng, route.coords);
    let distW = 0;
    if (distM < RISK_IMPACT.STRONG_THRESHOLD_M) distW = RISK_IMPACT.STRONG_WEIGHT;
    else if (distM < RISK_IMPACT.MEDIUM_THRESHOLD_M) distW = RISK_IMPACT.MEDIUM_WEIGHT;
    if (distW === 0) continue;
    raw += distW * (INCIDENT_TYPE_WEIGHT[inc.type] ?? 0.1) * (INCIDENT_LEVEL_WEIGHT[inc.level] ?? 0.2) * (c / 100);
  }
  return Math.min(100, Math.round((raw / 3.0) * 100));
}

/* ---------------------------------------------------------------
   14. SẮP XẾP ROUTE THEO CHẾ ĐỘ
--------------------------------------------------------------- */
const MODE_ALPHA = { fastest: 0, balanced: 1, safest: 3 };
function sortRoutesByMode(routes, mode) {
  const alpha = MODE_ALPHA[mode] ?? 1;
  return [...routes].sort((a, b) => {
    const wA = a.duration * (1 + alpha * a.riskScore / 100);
    const wB = b.duration * (1 + alpha * b.riskScore / 100);
    return wA - wB;
  });
}

/* ---------------------------------------------------------------
   15. HƯỚNG DẪN TỪNG BƯỚC (OSRM steps)
--------------------------------------------------------------- */
function buildStepInstruction(step) {
  const type = step.maneuver?.type ?? '';
  const mod = step.maneuver?.modifier ?? '';
  const name = step.name ? `đường ${step.name}` : 'tiếp tục';
  const map2 = {
    depart: '🚦 Xuất phát', arrive: '🏁 Đến điểm đích',
    turn: mod.includes('left') ? '↰ Rẽ trái vào' : '↱ Rẽ phải vào',
    'new name': '➡️ Đổi sang', merge: '↗️ Nhập vào',
    fork: mod.includes('left') ? '↰ Rẽ trái tại ngã ba' : '↱ Rẽ phải tại ngã ba',
    'end of road': mod.includes('left') ? '↰ Rẽ trái' : '↱ Rẽ phải',
    continue: '⬆️ Đi thẳng', roundabout: '🔄 Vào vòng xuyến',
    rotary: '🔄 Vào vòng xuyến',
  };
  const prefix = map2[type] ?? '➡️ Đi';
  return type === 'arrive' ? prefix : `${prefix} ${name}`;
}

function buildStepsHtml(legs) {
  if (!legs?.length) return '';
  const steps = legs.flatMap(leg => leg.steps ?? []);
  if (!steps.length) return '';
  return `<details class="route-steps-details">
    <summary><i class="fa-solid fa-list-ul"></i> Xem hướng dẫn chi tiết</summary>
    <ul class="route-steps">
      ${steps.map(s => {
        const dist = s.distance >= 1000
          ? (s.distance/1000).toFixed(1)+' km'
          : Math.round(s.distance)+' m';
        return `<li class="route-step">
          <span class="step-instr">${escapeHtml(buildStepInstruction(s))}</span>
          <span class="step-dist">${dist}</span>
        </li>`;
      }).join('')}
    </ul>
  </details>`;
}

/* ---------------------------------------------------------------
   16. RENDER SỰ CỐ TRÊN BẢN ĐỒ CHÍNH
--------------------------------------------------------------- */
function renderIncidents() {
  incidentLayerGroup.clearLayers();
  const now = Date.now();

  for (const inc of incidents) {
    const currentC = calculateCurrentConfidence(inc, now);
    if (currentC <= 0.1) continue;

    const meta = INCIDENT_TYPES[inc.type];
    const opacity = Math.max(0.25, currentC / 100);
    const confColor = getConfidenceColor(currentC);
    const levelColor = inc.level === 'cao' ? 'var(--risk-high)' : inc.level === 'trungbinh' ? 'var(--risk-mid)' : 'var(--risk-low)';

    const icon = L.divIcon({
      className: '',
      html: `<div class="incident-marker" style="border-color:${meta.color};opacity:${opacity}"><span>${meta.emoji}</span></div>`,
      iconSize: [30, 30], iconAnchor: [15, 28]
    });

    const marker = L.marker([inc.lat, inc.lng], { icon, opacity }).addTo(incidentLayerGroup);

    marker.bindPopup(`
      <div class="popup-box">
        <div class="p-head">${meta.emoji} ${meta.label}</div>
        <div class="confidence-bar"><div class="confidence-fill" style="width:${Math.round(currentC)}%;background:${confColor}"></div></div>
        <div class="p-row"><span>Độ tin cậy</span><b style="color:${confColor}">${Math.round(currentC)}%</b></div>
        <div class="p-row"><span>Báo cáo</span><b>${inc.reporterCount ?? 1} người</b></div>
        <div class="p-row"><span>Mô tả</span><b>${escapeHtml(inc.desc)}</b></div>
        <div class="p-row"><span>Cập nhật</span><b>${formatRelativeTime(inc.lastConfirmedAt ?? inc.createdAt)}</b></div>
        <span class="p-level" style="background:${levelColor}22;color:${levelColor}">
          Mức độ: ${LEVEL_LABEL[inc.level]}
        </span>
      </div>`);
  }
}

/* ---------------------------------------------------------------
   18. RENDER ROUTES
--------------------------------------------------------------- */
function renderRoutes(routes, mode) {
  routeLayerGroup.clearLayers();
  const sorted = sortRoutesByMode(routes, mode);
  const bounds = [];

  sorted.forEach((route, idx) => {
    const isBest = idx === 0;
    const color = ROUTE_COLORS[route.routeIndex] ?? ROUTE_COLORS[0];
    const line = L.polyline(route.coords, {
      color, weight: isBest ? 6 : 4, opacity: isBest ? 0.95 : 0.55,
      dashArray: isBest ? null : '2 8'
    }).addTo(routeLayerGroup);
    line.bindTooltip(
      `Tuyến ${route.id} · ${route.distance.toFixed(1)} km · ${Math.round(route.duration)} phút`,
      { sticky: true }
    );
    route.coords.forEach(c => bounds.push(c));
  });

  if (bounds.length) map.fitBounds(bounds, { padding: [60, 60] });

  const resultsEl = document.getElementById('route-results');
  resultsEl.classList.add('show');
  const modeName = mode === 'fastest' ? 'NHANH NHẤT' : mode === 'balanced' ? 'CÂN BẰNG' : 'AN TOÀN NHẤT';
  resultsEl.innerHTML = `<p class="panel-title" style="margin-top:4px;">KẾT QUẢ TUYẾN ĐƯỜNG</p>
    <p class="routes-summary">Tìm thấy ${sorted.length} tuyến đường</p>` +
    sorted.map((route, idx) => {
      const isBest = idx === 0;
      const rc = route.riskScore >= 66 ? 'var(--risk-high)' : route.riskScore >= 34 ? 'var(--risk-mid)' : 'var(--risk-low)';
      const color = ROUTE_COLORS[route.routeIndex] ?? ROUTE_COLORS[0];
      return `<div class="route-card ${isBest ? 'best' : ''}">
        <div class="route-card-head">
          <span class="title" style="color:${color}">● Tuyến ${route.id}</span>
          ${isBest ? `<span class="badge">Đề xuất (${modeName})</span>` : ''}
        </div>
        <div class="route-stats">
          <div class="stat"><b>${route.distance.toFixed(1)} km</b><span>Quãng đường</span></div>
          <div class="stat"><b>${Math.round(route.duration)} phút</b><span>Thời gian</span></div>
        </div>
        <div class="risk-row">
          <div class="risk-bar-track"><div class="risk-bar-fill" style="width:${route.riskScore}%;background:${rc}"></div></div>
          <span class="risk-value" style="color:${rc}">${route.riskScore}/100</span>
        </div>
        ${buildStepsHtml(route.legs)}
        <button class="choose-btn" onclick="chooseRoute('${route.id}')">Chọn tuyến này</button>
      </div>`;
    }).join('');
}

function chooseRoute(id) { showToast(`Đã chọn Tuyến ${id}. Bắt đầu chỉ đường...`); }

/* ---------------------------------------------------------------
   19. NÚT "TÌM ĐƯỜNG AN TOÀN"
--------------------------------------------------------------- */
async function onFindRouteClick() {
  if (isFindingRoute) return;

  const endText = document.getElementById('end-input').value.trim();
  if (!startLocation || !isValidCoordinate(startLocation.lat, startLocation.lng)) {
    showToast('Vui lòng chọn điểm bắt đầu hợp lệ.'); return;
  }
  if (!endText) { showToast('Vui lòng nhập điểm đến.'); return; }

  isFindingRoute = true;
  setFindButtonLoading(true, 'Đang tìm tuyến đường...');

  try {
    // Geocode fallback nếu chưa chọn gợi ý
    if (!endLocation) {
      setFindButtonLoading(true, 'Đang xác định địa điểm...');
      const res = await fetch('https://nominatim.openstreetmap.org/search?' + new URLSearchParams({
        format: 'json', q: endText, limit: '1', countrycodes: 'vn', addressdetails: '1'
      }), { headers: { 'Accept-Language': 'vi' } });
      if (!res.ok) throw new Error('Nominatim error');
      const results = await res.json();
      if (!results?.length) { showToast('Không tìm thấy địa điểm. Vui lòng chọn từ danh sách gợi ý.'); return; }
      const r = results[0];
      if (!isValidCoordinate(+r.lat, +r.lon)) { showToast('Không tìm thấy điểm đến hợp lệ.'); return; }
      endLocation = { lat: +r.lat, lng: +r.lon, label: shortenDisplayName(r.display_name), source: 'fallback' };
      document.getElementById('end-input').value = endLocation.label;
      updateEndMarker(endLocation.lat, endLocation.lng, endLocation.label);
      setFindButtonLoading(true, 'Đang tìm tuyến đường...');
    }

    const dist = haversineMeters(startLocation.lat, startLocation.lng, endLocation.lat, endLocation.lng);
    if (dist < 50) { showToast('Điểm bắt đầu và điểm đến không được giống nhau.'); return; }

    cleanupExpiredIncidents();
    const routes = await findSafeRoutes(startLocation, endLocation);
    routes.forEach(r => { r.riskScore = calculateRouteRisk(r); });
    currentRoutes = routes;
    renderRoutes(routes, selectedMode);

    if (window.innerWidth <= 820) document.getElementById('sidebar').classList.add('expanded');

  } catch (err) {
    console.error('SafeRoute error:', err);
    if (err.message === 'Không tìm thấy tuyến đường') showToast('Không tìm thấy tuyến đường giữa hai địa điểm.');
    else showToast('Không thể tìm tuyến đường. Vui lòng thử lại.');
  } finally {
    isFindingRoute = false;
    setFindButtonLoading(false, 'Tìm đường an toàn');
  }
}

function setFindButtonLoading(isLoading, label) {
  const btn = document.getElementById('find-btn');
  btn.disabled = isLoading;
  document.getElementById('find-btn-label').textContent = label ?? (isLoading ? 'Đang tìm...' : 'Tìm đường an toàn');
}

/* ---------------------------------------------------------------
   20. SWAP START / END
--------------------------------------------------------------- */
function swapLocations() {
  const si = document.getElementById('start-input');
  const ei = document.getElementById('end-input');
  const tmpText = si.value; si.value = ei.value; ei.value = tmpText;
  const tmpLoc = startLocation; startLocation = endLocation; endLocation = tmpLoc;

  if (startLocation && isValidCoordinate(startLocation.lat, startLocation.lng))
    updateStartMarker(startLocation.lat, startLocation.lng, startLocation.label);
  else { if (startMarker) { map.removeLayer(startMarker); startMarker = null; } showToast('Vui lòng chọn lại điểm bắt đầu.'); }

  if (endLocation && isValidCoordinate(endLocation.lat, endLocation.lng))
    updateEndMarker(endLocation.lat, endLocation.lng, endLocation.label);
  else { if (endMarker) { map.removeLayer(endMarker); endMarker = null; } }
}

--------------------------------------------------------------- */
document.getElementById('mode-group').addEventListener('change', e => {
  selectedMode = e.target.value;
  document.querySelectorAll('.mode-option').forEach(opt => {
    opt.classList.toggle('checked', opt.dataset.mode === selectedMode);
  });
  if (currentRoutes.length > 0) renderRoutes(currentRoutes, selectedMode);
});

/* ---------------------------------------------------------------
   22. MINI MAP BÁO CÁO SỰ CỐ — độc lập với bản đồ chính
--------------------------------------------------------------- */
function initReportMap() {
  if (reportMapInitialized) {
    setTimeout(() => reportMap?.invalidateSize(), 100);
    return;
  }

  reportMap = L.map('report-mini-map', {
    zoomControl: true,
    attributionControl: true
  }).setView([10.7769, 106.7009], 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(reportMap);

  // Click mini map → chọn vị trí
  reportMap.on('click', e => selectReportLocation(e.latlng));

  reportMapInitialized = true;
  setTimeout(() => reportMap?.invalidateSize(), 100);
}

function selectReportLocation(latlng) {
  reportSelectedLatLng = { lat: latlng.lat, lng: latlng.lng };

  if (reportMarker) { reportMap.removeLayer(reportMarker); reportMarker = null; }

  const icon = L.divIcon({
    className: '',
    html: '<div class="report-location-marker"><i class="fa-solid fa-location-dot"></i></div>',
    iconSize: [36, 36], iconAnchor: [18, 34]
  });

  reportMarker = L.marker([latlng.lat, latlng.lng], { icon, draggable: true }).addTo(reportMap);

  // Kéo marker để tinh chỉnh vị trí
  reportMarker.on('dragend', e => {
    const pos = e.target.getLatLng();
    reportSelectedLatLng = { lat: pos.lat, lng: pos.lng };
    updateReportLocationText(pos.lat, pos.lng);
  });

  updateReportLocationText(latlng.lat, latlng.lng);
}

async function updateReportLocationText(lat, lng) {
  const input = document.getElementById('report-location');
  input.value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  try {
    const res = await fetch('https://nominatim.openstreetmap.org/reverse?' + new URLSearchParams({
      format: 'json', lat: String(lat), lon: String(lng), zoom: '18', addressdetails: '1'
    }), { headers: { 'Accept-Language': 'vi' } });
    if (!res.ok) return;
    const data = await res.json();
    if (data?.display_name) input.value = shortenDisplayName(data.display_name);
  } catch { /* reverse geocode thất bại — giữ lat/lng */ }
}

function useCurrentLocationForReport() {
  if (!navigator.geolocation) {
    showToast('Trình duyệt không hỗ trợ định vị.'); return;
  }
  const btn = document.getElementById('report-current-location');
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    pos => {
      btn.disabled = false;
      const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      selectReportLocation(latlng);
      reportMap.setView([latlng.lat, latlng.lng], 17);
    },
    () => {
      btn.disabled = false;
      showToast('Không thể lấy vị trí hiện tại. Hãy chọn trực tiếp trên bản đồ.');
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

/* ---------------------------------------------------------------
   23. MỞ / ĐÓNG MODAL BÁO CÁO
--------------------------------------------------------------- */
function openReportModal() {
  reportSelectedLatLng = null;
  document.getElementById('report-location').value = 'Chưa chọn vị trí';
  document.getElementById('report-modal').classList.remove('hidden');

  setTimeout(() => {
    initReportMap();
    if (reportMap) {
      reportMap.invalidateSize();
      // Ưu tiên hiển thị vị trí bắt đầu hiện tại nếu có
      if (startLocation && isValidCoordinate(startLocation.lat, startLocation.lng)) {
        reportMap.setView([startLocation.lat, startLocation.lng], 15);
      }
    }
  }, 150);
}

function closeReportModal() {
  document.getElementById('report-modal').classList.add('hidden');
  reportSelectedLatLng = null;
  if (reportMarker && reportMap) {
    reportMap.removeLayer(reportMarker);
    reportMarker = null;
  }
  // Reset form
  document.getElementById('report-desc').value = '';
  // Reset level pills
  document.querySelectorAll('.level-pill').forEach(p => p.classList.remove('checked'));
  document.querySelector('.level-pill.low')?.classList.add('checked');
  const lowInput = document.querySelector('input[name="level"][value="thap"]');
  if (lowInput) lowInput.checked = true;
}

document.getElementById('level-group').addEventListener('change', e => {
  document.querySelectorAll('.level-pill').forEach(p => p.classList.remove('checked'));
  e.target.closest('.level-pill').classList.add('checked');
});

/* ---------------------------------------------------------------
   24. SUBMIT REPORT — bắt buộc chọn vị trí trên mini map
--------------------------------------------------------------- */
function submitReport() {
  if (!reportSelectedLatLng) {
    showToast('Vui lòng chọn vị trí sự cố trên bản đồ.');
    return;
  }

  const type = document.getElementById('report-type').value;
  const level = document.querySelector('input[name="level"]:checked').value;
  const desc = document.getElementById('report-desc').value.trim() || 'Không có mô tả.';

  addOrConfirmIncident({
    type, level,
    lat: reportSelectedLatLng.lat,
    lng: reportSelectedLatLng.lng,
    desc,
  });

  closeReportModal();
  showToast('Cảm ơn bạn! Báo cáo đã được ghi nhận.');
}

/* ---------------------------------------------------------------
   25. TOAST
--------------------------------------------------------------- */
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
}

/* ---------------------------------------------------------------
   26. BOTTOM SHEET (MOBILE)
--------------------------------------------------------------- */
function toggleSheet() {
  document.getElementById('sidebar').classList.toggle('expanded');
}

/* ---------------------------------------------------------------
   27. KHỞI CHẠY
--------------------------------------------------------------- */
window.addEventListener('DOMContentLoaded', initMap);
</script>
