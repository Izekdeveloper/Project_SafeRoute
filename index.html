<script>
/* ================================================================
   SAFEROUTE — LOGIC DEMO (FRONTEND ONLY)
   ----------------------------------------------------------------
   GHI CHÚ THUẬT TOÁN (cho sinh viên đọc/chỉnh sửa):

   Bản đồ đường đi được mô hình hoá như một ĐỒ THỊ (Graph):
     - Node  = giao lộ (điểm giao nhau giữa các con đường)
     - Edge  = đoạn đường nối giữa 2 giao lộ

   Mỗi Edge có 2 thuộc tính:
     - distance  : độ dài đoạn đường (km)
     - riskScore : mức rủi ro của đoạn đường, chuẩn hoá về [0,1]

   Trọng số (weight) của mỗi Edge dùng để tìm đường được tính theo công thức:

        weight = distance * (1 + alpha * riskScore)

   Trong đó:
     - alpha càng lớn thì thuật toán càng "ngại" đi vào đoạn đường rủi ro cao
     - alpha = 0  → chế độ "Nhanh nhất"   (bỏ qua rủi ro)
     - alpha = 1  → chế độ "Cân bằng"
     - alpha = 3  → chế độ "An toàn nhất" (ưu tiên né rủi ro rất mạnh)

   Ở phiên bản PROTOTYPE này, chúng ta CHƯA dựng đồ thị thật với hàng trăm
   giao lộ + chưa chạy Dijkstra/A*. Thay vào đó, findSafeRoute() trả về
   3 tuyến đường mẫu (hard-code toạ độ) tương ứng với 3 alpha ở trên, để
   demo giao diện & luồng tương tác. Khi có dữ liệu OSM thật (danh sách
   node/edge của thành phố), ta chỉ cần thay phần bên trong findSafeRoute()
   bằng thuật toán Dijkstra/A* chạy trên weight ở công thức trên — toàn bộ
   phần giao diện, renderRoutes(), renderIncidents() có thể giữ nguyên.
================================================================ */

/* ---------------------------------------------------------------
   1. DỮ LIỆU CẤU HÌNH LOẠI SỰ CỐ
--------------------------------------------------------------- */

};

   đoạn đường (edge) gần nó — xem công thức renderRoutes() bên dưới.
--------------------------------------------------------------- */
let incidents = [

  { id: 5, type: 'danger',       level: 'cao',       lat: 10.8010, lng: 106.7110, time: '1 ngày trước',  confirms: 14, desc: 'Khu vực thường xuyên xảy ra cướp giật ban đêm.' },
  { id: 6, type: 'damaged_road', level: 'thap',      lat: 10.7690, lng: 106.6900, time: '3 giờ trước',   confirms: 7,  desc: 'Mặt đường có nhiều ổ gà.' },
  { id: 7, type: 'flood',        level: 'trungbinh', lat: 10.7940, lng: 106.6870, time: '40 phút trước', confirms: 11, desc: 'Ngập cục bộ tại điểm trũng.' },

  },
  balanced: {

    distance: 5.8, duration: 16, riskScore: 35, color: '#f4b400',
    coords: [[10.7725,106.6980],[10.7750,106.7010],[10.7780,106.7040],[10.7810,106.7055],[10.7840,106.7075],[10.7871,106.7090]],
    highlights: ['Cân bằng giữa thời gian và độ an toàn', 'Tránh điểm ngập nặng nhất', 'Vẫn đi gần khu vực có báo cáo ùn tắc']
  },
  safest: {
    id: 'C', name: 'AN TOÀN NHẤT', mode: 'safest', alpha: 3,
    distance: 6.4, duration: 19, riskScore: 12, color: '#12b76a',
    coords: [[10.7725,106.6980],[10.7715,106.7030],[10.7735,106.7075],[10.7775,106.7100],[10.7820,106.7110],[10.7871,106.7090]],
    highlights: ['Ít điểm ngập', 'Không có tai nạn nghiêm trọng', 'Tránh khu vực đang thi công']

/* ---------------------------------------------------------------
   4. TRẠNG THÁI CHUNG (state)
--------------------------------------------------------------- */
let map;
let incidentLayerGroup;
let routeLayerGroup;
let selectedMode = 'balanced';
let pendingReportLatLng = null; // vị trí người dùng chọn khi báo cáo

/* ---- State cho tính năng CHỌN ĐIỂM BẮT ĐẦU (GPS / click bản đồ / tìm kiếm) ---- */
let startLocation = { lat: 10.7725, lng: 106.6980, label: 'Chợ Bến Thành', source: 'default' };
let endLocation = null;          // dự phòng cho việc chọn điểm đến bằng toạ độ (chưa triển khai ở bản này)
let startMarker = null;
let selectingStartOnMap = false; // true khi người dùng đang chờ click bản đồ để chọn điểm bắt đầu
let startSearchTimer = null;
let startSearchToken = 0;        // đảm bảo chỉ áp dụng kết quả của lần tìm kiếm mới nhất

/* ---------------------------------------------------------------
   5. KHỞI TẠO BẢN ĐỒ (mặc định trung tâm TP.HCM)
--------------------------------------------------------------- */
function initMap() {
  map = L.map('map', { zoomControl: false }).setView([10.7769, 106.7009], 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; SafeRoute built by IzekNguyen',

  }).addTo(map);

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  incidentLayerGroup = L.layerGroup().addTo(map);
  routeLayerGroup = L.layerGroup().addTo(map);

  //   1) Modal báo cáo sự cố đang mở  -> chọn vị trí báo cáo (hành vi cũ, giữ nguyên)
  //   2) Đang ở chế độ chọn điểm bắt đầu -> chọn start location

  renderNearbyPanel();

/* ---------------------------------------------------------------
   6. HÀM TÍNH RISK SCORE (mô phỏng)
   Công thức chuẩn hoá đề xuất trong đồ án:

     riskScore = floodRisk + accidentRisk + constructionRisk
                 + trafficRisk + communityReports   (rồi chuẩn hoá về 0→1)

   Ở bản demo, mỗi tuyến đã có riskScore mẫu dựng sẵn (ROUTES_DATA),
   hàm này minh hoạ cách một hệ thống thật sẽ tổng hợp điểm rủi ro
   từ các sự cố cộng đồng nằm gần tuyến đường.
--------------------------------------------------------------- */
function calculateRiskScore(route) {
  // ---- Phiên bản DEMO: dùng điểm số đã gán sẵn cho tuyến ----
  if (route && typeof route.riskScore === 'number') return route.riskScore;

  // ---- Gợi ý công thức thật (chưa dùng trong demo) ----
  // const floodRisk        = countNearbyIncidents(route, 'flood')        * 0.25;
  // const accidentRisk     = countNearbyIncidents(route, 'accident')     * 0.30;
  // const constructionRisk = countNearbyIncidents(route, 'construction') * 0.15;
  // const trafficRisk      = countNearbyIncidents(route, 'traffic')      * 0.15;
  // const communityReports = countNearbyIncidents(route, 'danger')       * 0.15;
  // const raw = floodRisk + accidentRisk + constructionRisk + trafficRisk + communityReports;
  // return Math.min(100, Math.round(raw * 100)); // chuẩn hoá 0-100
  return 50;
}

/* ---------------------------------------------------------------
   6b. CHỌN ĐIỂM BẮT ĐẦU — GPS / click bản đồ / tìm kiếm Nominatim
   startLocation luôn ở dạng { lat, lng, label, source } để sau này
   findSafeRoute() có thể dùng toạ độ thật thay vì chỉ text.
--------------------------------------------------------------- */

// Thoát HTML cơ bản trước khi chèn dữ liệu từ Nominatim vào innerHTML
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

// Rút gọn display_name của Nominatim (giữ 3 phần đầu) cho gọn UI
function shortenDisplayName(displayName) {
  const parts = String(displayName).split(',').map(p => p.trim());
  return parts.slice(0, 3).join(', ');
}

// Gán điểm bắt đầu mới (dùng chung cho cả GPS / click bản đồ / tìm kiếm)
function setStartLocation(lat, lng, label, source) {
  startLocation = { lat, lng, label, source };
  document.getElementById('start-input').value = label;
  updateStartMarker(lat, lng, label);
}

// Vẽ/di chuyển marker điểm bắt đầu — icon khác hẳn marker sự cố
function updateStartMarker(lat, lng, label) {
  if (startMarker) {
    map.removeLayer(startMarker);
    startMarker = null;
  }
  const icon = L.divIcon({
    className: '',
    html: '<div class="start-marker-icon"><i class="fa-solid fa-person-walking"></i></div>',
    iconSize: [34, 34],
    iconAnchor: [17, 32]
  });
  startMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000 }).addTo(map);
  startMarker.bindPopup(`
    <div class="popup-box">
      <div class="p-head"><i class="fa-solid fa-location-dot" style="color:var(--primary)"></i> Điểm bắt đầu</div>
      <div class="p-row"><b>${escapeHtml(label)}</b></div>
    </div>
  `);
}

/* ---- 1) GPS: chỉ xin quyền khi người dùng bấm nút, không tự động khi load ---- */
function handleGpsClick() {
  if (!navigator.geolocation) {
    showToast('Trình duyệt không hỗ trợ định vị.');
    return;
  }
  if (!window.isSecureContext) {
    showToast('GPS yêu cầu HTTPS hoặc localhost.');
    return;
  }

  const gpsBtn = document.getElementById('gps-btn');
  gpsBtn.classList.add('loading');

  navigator.geolocation.getCurrentPosition(
    function (pos) {
      gpsBtn.classList.remove('loading');
      const { latitude, longitude } = pos.coords;
      setStartLocation(latitude, longitude, 'Vị trí hiện tại', 'gps');
      map.setView([latitude, longitude], 16);
      showToast('Đã lấy vị trí hiện tại.');
    },
    function (err) {
      gpsBtn.classList.remove('loading');
      let msg = 'Không thể lấy vị trí hiện tại.';
      if (err.code === err.PERMISSION_DENIED) msg = 'Bạn chưa cho phép truy cập vị trí.';
      else if (err.code === err.POSITION_UNAVAILABLE) msg = 'Không thể xác định vị trí hiện tại.';
      else if (err.code === err.TIMEOUT) msg = 'Lấy vị trí quá lâu, vui lòng thử lại.';
      showToast(msg);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

/* ---- 2) Chọn điểm bắt đầu bằng click trên bản đồ ---- */
function enableSelectStartOnMap() {
  selectingStartOnMap = true;
  map.getContainer().classList.add('selecting-start');
  showToast('Chạm vào bản đồ để chọn điểm bắt đầu.');
}
function disableSelectStartOnMap() {
  selectingStartOnMap = false;
  map.getContainer().classList.remove('selecting-start');
}

function selectStartFromMap(latlng) {
  const lat = latlng.lat, lng = latlng.lng;
  disableSelectStartOnMap();

  const fallbackLabel = lat.toFixed(5) + ', ' + lng.toFixed(5);
  setStartLocation(lat, lng, fallbackLabel, 'map');

  // Cố gắng reverse geocode để hiển thị tên địa điểm dễ đọc hơn toạ độ
  reverseGeocodeStartLabel(lat, lng);
}

function reverseGeocodeStartLabel(lat, lng) {
  fetch('https://nominatim.openstreetmap.org/reverse?' + new URLSearchParams({
    format: 'json', lat: String(lat), lon: String(lng), zoom: '18', addressdetails: '1'
  }), { headers: { 'Accept-Language': 'vi' } })
    .then(res => (res.ok ? res.json() : Promise.reject(new Error('reverse geocode failed'))))
    .then(data => {
      // Nếu người dùng đã chọn điểm khác trong lúc chờ phản hồi thì bỏ qua
      if (!startLocation || startLocation.lat !== lat || startLocation.lng !== lng) return;
      if (data && data.display_name) {
        const label = shortenDisplayName(data.display_name);
        startLocation.label = label;
        document.getElementById('start-input').value = label;
      }
    })
    .catch(() => { /* Reverse geocode lỗi -> giữ nguyên toạ độ đã hiển thị, không crash */ });
}

/* ---- 3) Nhập địa điểm + gợi ý từ Nominatim (debounce 400ms) ---- */
function initStartLocationControls() {
  const input = document.getElementById('start-input');
  const gpsBtn = document.getElementById('gps-btn');

  gpsBtn.addEventListener('click', handleGpsClick);

  input.addEventListener('focus', function () {
    if (input.value.trim().length < 2) showStartQuickOptions();
  });

  input.addEventListener('input', function () {
    startLocation = null; // toạ độ cũ không còn hợp lệ khi người dùng gõ lại
    const query = input.value.trim();
    clearTimeout(startSearchTimer);
    if (query.length < 2) {
      showStartQuickOptions();
      return;
    }
    startSearchTimer = setTimeout(() => searchStartLocation(query), 400);
  });

  // Đóng dropdown khi click ra ngoài ô điểm bắt đầu
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#start-field')) hideStartSuggestions();
  });
}

// Gợi ý nhanh khi ô còn trống/ngắn: cho phép chọn trên bản đồ
function showStartQuickOptions() {
  const suggestBox = document.getElementById('start-suggestions');
  suggestBox.innerHTML = `
    <li class="suggestion-item pick-map-option" role="option">
      <i class="fa-solid fa-map-location-dot"></i>
      <div><div class="s-main">Chọn trên bản đồ</div></div>
    </li>`;
  suggestBox.classList.remove('hidden');
  document.getElementById('start-input').setAttribute('aria-expanded', 'true');

  suggestBox.querySelector('.pick-map-option').addEventListener('click', function () {
    hideStartSuggestions();
    enableSelectStartOnMap();
  });
}

function hideStartSuggestions() {
  const suggestBox = document.getElementById('start-suggestions');
  suggestBox.classList.add('hidden');
  suggestBox.innerHTML = '';
  document.getElementById('start-input').setAttribute('aria-expanded', 'false');
}

async function searchStartLocation(query) {
  const token = ++startSearchToken; // dùng để bỏ kết quả cũ nếu có query mới hơn
  try {
    const res = await fetch('https://nominatim.openstreetmap.org/search?' + new URLSearchParams({
      format: 'json', q: query, limit: '5', countrycodes: 'vn', addressdetails: '1'
    }), { headers: { 'Accept-Language': 'vi' } });

    if (token !== startSearchToken) return;
    if (!res.ok) throw new Error('Nominatim error');
    const results = await res.json();
    if (token !== startSearchToken) return;
    renderStartSuggestions(results);
  } catch (err) {
    if (token !== startSearchToken) return;
    showToast('Không thể tìm địa điểm. Vui lòng thử lại.');
  }
}

function renderStartSuggestions(results) {
  const suggestBox = document.getElementById('start-suggestions');

  if (!results || results.length === 0) {
    suggestBox.innerHTML = '<li class="suggestion-empty">Không tìm thấy địa điểm phù hợp.</li>';
    suggestBox.classList.remove('hidden');
    return;
  }

  suggestBox.innerHTML = results.map((r, i) => {
    const shortName = shortenDisplayName(r.display_name);
    const mainPart = shortName.split(',')[0];
    const subPart = shortName.split(',').slice(1).join(',').trim();
    return `
      <li class="suggestion-item" role="option" data-index="${i}">
        <i class="fa-solid fa-location-dot"></i>
        <div>
          <div class="s-main">${escapeHtml(mainPart)}</div>
          ${subPart ? `<div class="s-sub">${escapeHtml(subPart)}</div>` : ''}
        </div>
      </li>`;
  }).join('');

  suggestBox.classList.remove('hidden');
  document.getElementById('start-input').setAttribute('aria-expanded', 'true');

  suggestBox.querySelectorAll('.suggestion-item[data-index]').forEach(item => {
    item.addEventListener('click', function () {
      const idx = Number(item.dataset.index);
      const r = results[idx];
      const label = shortenDisplayName(r.display_name);
      const lat = Number(r.lat), lng = Number(r.lon);

      setStartLocation(lat, lng, label, 'search');
      map.setView([lat, lng], 16);
      hideStartSuggestions();
      showToast('Đã chọn điểm bắt đầu.');
    });
  });
}

/* ---------------------------------------------------------------
   7. HÀM TÌM ĐƯỜNG AN TOÀN (mô phỏng Dijkstra/A*)
   alpha (mức ưu tiên an toàn) được quyết định bởi mode đã chọn:
      fastest  -> alpha = 0
      balanced -> alpha = 1
      safest   -> alpha = 3
   weight = distance * (1 + alpha * riskScoreNormalized)
--------------------------------------------------------------- */
function findSafeRoute(start, end, mode) {
  // ---- DEMO: trả thẳng dữ liệu mẫu ứng với 3 chế độ ----
  // start giờ là object { lat, lng, label, source } (xem setStartLocation ở trên)
  // thay vì chỉ là text, để sẵn sàng kết nối OSRM/GraphHopper/engine thật sau này.
  // Thuật toán thật sẽ: dựng graph từ OSM -> chạy Dijkstra/A* với
  // hàm trọng số weight(edge) = edge.distance * (1 + alpha * edge.riskScore)
  // rồi trả về đường đi có tổng weight nhỏ nhất.
  console.log('findSafeRoute(demo): start =', start, '-> end =', end, '| mode =', mode);

}

/* ---------------------------------------------------------------
   8. RENDER SỰ CỐ TRÊN BẢN ĐỒ
--------------------------------------------------------------- */
function renderIncidents() {
  incidentLayerGroup.clearLayers();

  incidents.forEach(inc => {
    const meta = INCIDENT_TYPES[inc.type];
    const icon = L.divIcon({
      className: '',
      html: `<div class="incident-marker" style="border-color:${meta.color}"><span>${meta.emoji}</span></div>`,
      iconSize: [30, 30],
      iconAnchor: [15, 28]
    });

    const marker = L.marker([inc.lat, inc.lng], { icon }).addTo(incidentLayerGroup);

    const levelColor = inc.level === 'cao' ? 'var(--risk-high)' : inc.level === 'trungbinh' ? 'var(--risk-mid)' : 'var(--risk-low)';
    marker.bindPopup(`
      <div class="popup-box">
        <div class="p-head">${meta.emoji} ${meta.label}</div>
        <div class="p-row"><span>Mô tả</span><b>${inc.desc}</b></div>
        <div class="p-row"><span>Thời gian</span><b>${inc.time}</b></div>
        <div class="p-row"><span>Xác nhận</span><b>${inc.confirms} người</b></div>
        <span class="p-level" style="background:${levelColor}22;color:${levelColor}">Mức độ: ${LEVEL_LABEL[inc.level]}</span>
      </div>
    `);
  });
}

/* ---------------------------------------------------------------
   9. RENDER PANEL "CẢNH BÁO GẦN BẠN" (demo tĩnh)
--------------------------------------------------------------- */
function renderNearbyPanel() {
  const nearby = [
    { type: 'flood', label: 'Ngập nước', dist: '500m' },
    { type: 'accident', label: 'Tai nạn', dist: '1.2km' },
    { type: 'construction', label: 'Công trình', dist: '2.1km' }
  ];
  const list = document.getElementById('nearby-list');
  list.innerHTML = nearby.map(n => {
    const meta = INCIDENT_TYPES[n.type];
    return `<div class="np-item">
              <span class="np-label">${meta.emoji} ${n.label}</span>
              <span class="np-dist">${n.dist}</span>
            </div>`;
  }).join('');
}

/* ---------------------------------------------------------------
   10. RENDER 3 TUYẾN ĐƯỜNG + THẺ KẾT QUẢ Ở SIDEBAR
--------------------------------------------------------------- */
function renderRoutes(routes, mode) {
  routeLayerGroup.clearLayers();

  const bounds = [];
  routes.forEach(route => {
    const isBest = route.mode === mode;
    const line = L.polyline(route.coords, {
      color: route.color,
      weight: isBest ? 6 : 4,
      opacity: isBest ? 0.95 : 0.55,
      dashArray: isBest ? null : '2 8'
    }).addTo(routeLayerGroup);

    line.bindTooltip(`Tuyến ${route.id} · ${route.name} · ${route.distance}km`, { sticky: true });
    route.coords.forEach(c => bounds.push(c));
  });

  if (bounds.length) map.fitBounds(bounds, { padding: [60, 60] });

  // ---- Render card kết quả ở sidebar ----
  const resultsEl = document.getElementById('route-results');
  resultsEl.classList.add('show');
  resultsEl.innerHTML = '<p class="panel-title" style="margin-top:4px;">KẾT QUẢ TUYẾN ĐƯỜNG</p>' +
    routes.map(route => {
      const riskColor = route.riskScore >= 66 ? 'var(--risk-high)' : route.riskScore >= 34 ? 'var(--risk-mid)' : 'var(--risk-low)';
      const isBest = route.mode === mode;
      return `
        <div class="route-card ${isBest ? 'best' : ''}">
          <div class="route-card-head">
            <span class="title">${route.name}</span>
            ${isBest ? '<span class="badge">Đề xuất</span>' : ''}
          </div>
          <div class="route-stats">
            <div class="stat"><b>${route.distance} km</b><span>Quãng đường</span></div>
            <div class="stat"><b>${route.duration} phút</b><span>Thời gian</span></div>
          </div>
          <div class="risk-row">
            <div class="risk-bar-track"><div class="risk-bar-fill" style="width:${route.riskScore}%;background:${riskColor}"></div></div>
            <span class="risk-value" style="color:${riskColor}">${route.riskScore}/100</span>
          </div>
          <ul class="route-points">
            ${route.highlights.map(h => `<li><i class="fa-solid fa-circle-check"></i>${h}</li>`).join('')}
          </ul>
          <button class="choose-btn" onclick="chooseRoute('${route.id}')">Chọn tuyến này</button>
        </div>`;
    }).join('');
}

function chooseRoute(routeId) {
  showToast(`Đã chọn Tuyến ${routeId}. Bắt đầu chỉ đường...`);
}

/* ---------------------------------------------------------------
   11. XỬ LÝ NÚT "TÌM ĐƯỜNG AN TOÀN"
--------------------------------------------------------------- */
function onFindRouteClick() {
  const end = document.getElementById('end-input').value.trim();

  // Ưu tiên toạ độ đã chọn (GPS / click bản đồ / tìm kiếm) thay vì text thô
  if (!startLocation) {
    showToast('Vui lòng chọn điểm bắt đầu.');
    return;
  }
  if (!end) {
    showToast('Vui lòng nhập điểm đến.');
    return;
  }

  const routes = findSafeRoute(startLocation, end, selectedMode);
  renderRoutes(routes, selectedMode);

  // Trên mobile, tự mở rộng bottom sheet để thấy kết quả
  if (window.innerWidth <= 820) {
    document.getElementById('sidebar').classList.add('expanded');
  }
}

function swapLocations() {
  const startInput = document.getElementById('start-input');
  const endInput = document.getElementById('end-input');

  // Đổi chỗ text hiển thị
  const tmpText = startInput.value;
  startInput.value = endInput.value;
  endInput.value = tmpText;

  // Đổi chỗ toạ độ đã lưu tương ứng (endLocation hiện chưa được chọn ở bản này
  // nên nếu start có toạ độ mà end thì không, sau khi swap start sẽ mất toạ độ
  // — đúng theo quy tắc: không có toạ độ thì không thể "chọn" — người dùng
  // cần chọn lại điểm bắt đầu bằng GPS/bản đồ/tìm kiếm).
  const tmpLoc = startLocation;
  startLocation = endLocation;
  endLocation = tmpLoc;

  if (startLocation) {
    updateStartMarker(startLocation.lat, startLocation.lng, startLocation.label);
  } else if (startMarker) {
    map.removeLayer(startMarker);
    startMarker = null;
  }
}

/* ---------------------------------------------------------------
   12. CHỌN CHẾ ĐỘ (fastest / balanced / safest)
--------------------------------------------------------------- */
document.getElementById('mode-group').addEventListener('change', function (e) {
  selectedMode = e.target.value;
  document.querySelectorAll('.mode-option').forEach(opt => {
    opt.classList.toggle('checked', opt.dataset.mode === selectedMode);
  });
});

/* ---------------------------------------------------------------
   13. MODAL BÁO CÁO SỰ CỐ
--------------------------------------------------------------- */
function openReportModal() {
  pendingReportLatLng = null;
  document.getElementById('report-location').value = '';
  document.getElementById('report-modal').classList.remove('hidden');
}
function closeReportModal() {
  document.getElementById('report-modal').classList.add('hidden');
}
document.getElementById('level-group').addEventListener('change', function (e) {
  document.querySelectorAll('.level-pill').forEach(p => p.classList.remove('checked'));
  e.target.closest('.level-pill').classList.add('checked');
});

/* addIncident(): thêm 1 sự cố mới do người dùng báo cáo vào danh sách
   demo (chưa gửi lên backend). Trong bản thực tế, hàm này sẽ POST dữ
   liệu lên API rồi cập nhật lại incidents từ server. */
function addIncident(newIncident) {
  incidents.push(newIncident);
  renderIncidents();
}

function submitReport() {
  const type = document.getElementById('report-type').value;
  const level = document.querySelector('input[name="level"]:checked').value;
  const desc = document.getElementById('report-desc').value.trim() || 'Không có mô tả.';
  const latlng = pendingReportLatLng || map.getCenter();

  const newIncident = {
    id: Date.now(),
    type, level,
    lat: latlng.lat, lng: latlng.lng,
    time: 'Vừa xong',
    confirms: 1,
    desc
  };

  addIncident(newIncident);
  closeReportModal();
  showToast('Cảm ơn bạn! Báo cáo đã được ghi nhận.');

  // reset form
  document.getElementById('report-desc').value = '';
}

   14. TOAST THÔNG BÁO NHỎ
--------------------------------------------------------------- */

function showToast(msg) {
  const toast = document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
}
