<style>
.transport-hub-combo {
  display: flex;

  align-items: center;

  cursor: pointer;
}
.transport-hub-note {
  background: #ffffff;
  border: 1.5px solid #2f7ee0;
  border-radius: 8px;
  padding: 5px 9px;

  text-align: center;
  margin-bottom: 6px;
  position: relative;
}
.transport-hub-note::after {
  content: '';
  position: absolute;
  bottom: -6px;

  transform: translateX(-50%);

  border-style: solid;
  border-color: #2f7ee0 transparent transparent;
}
.transport-hub-note .th-title {
  font-size: 12px;

  align-items: center;

}
.transport-hub-marker {

<body>

<div id="app">

  <!-- ============================================================ HEADER -->

<!-- ============================================================ MODAL BÁO CÁO SỰ CỐ -->

        <label class="level-pill mid"><input type="radio" name="level" value="trungbinh" />Trung bình</label>

      <button type="button" id="report-current-location" class="report-location-gps"
        onclick="useCurrentLocationForReport()">

        Vị trí hiện tại
      </button>

          type="text"
          id="report-location"
          placeholder="Nhập địa chỉ sự cố hoặc chọn trên bản đồ"

          role="combobox"

          aria-expanded="false"
          aria-controls="report-suggestions"
        />

      </div>

<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toast-text"></span></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ================================================================
   SAFEROUTE — ROUTING THẬT (OSRM) + CONFIDENCE DECAY
   ----------------------------------------------------------------
   Kiến trúc:
   1. Autocomplete Nominatim (start & end) với debounce 400ms
   2. OSRM routing API → polyline theo đường giao thông thật
   3. Risk score từ khoảng cách incident đến route (Haversine)
   4. Báo cáo sự cố qua mini map riêng (Leaflet instance độc lập)
   5. Confidence = 50% khi tạo mới, tăng khi có người báo thêm
   6. Decay theo half-life riêng cho từng loại sự cố
   7. Incident biến mất khi confidence → 0

   Về Backend:
   Hiện tại là frontend demo (mảng local). Để deploy thật, thay
   addOrConfirmIncident() bằng POST /api/incidents và GET /api/incidents
   từ server — server sẽ là nguồn sự thật duy nhất về confidence,
   reporterIds, decay, và persistence.
================================================================ */

/* ---------------------------------------------------------------
   DEMO USER ID — thay bằng user ID từ auth backend khi triển khai thật
   Dùng để tránh cùng 1 người spam +50% liên tục.
--------------------------------------------------------------- */
const DEMO_USER_ID = 'demo-user-' + Math.random().toString(36).slice(2, 9);

/* ---------------------------------------------------------------
   CONSTANTS
--------------------------------------------------------------- */
// Ngưỡng khoảng cách để gộp incident (cùng loại, trong bán kính này)
const INCIDENT_MERGE_RADIUS_METERS = 100;

// Ngưỡng ảnh hưởng của incident đến risk score tuyến đường
const RISK_IMPACT = {
  STRONG_THRESHOLD_M: 100,   // < 100m → ảnh hưởng mạnh
  MEDIUM_THRESHOLD_M: 300,   // 100–300m → ảnh hưởng vừa
  STRONG_WEIGHT: 1.0,
  MEDIUM_WEIGHT: 0.4,
};

// Trọng số loại sự cố trong risk score
const INCIDENT_TYPE_WEIGHT = {
  accident: 0.30, flood: 0.25, danger: 0.20,
  construction: 0.15, traffic: 0.12,
  damaged_road: 0.10, obstacle: 0.08,
};

// Trọng số mức độ trong risk score
const INCIDENT_LEVEL_WEIGHT = { cao: 1.0, trungbinh: 0.5, thap: 0.2 };

// Half-life decay: thời gian để confidence giảm 50% (giờ)
const INCIDENT_DECAY_CONFIG = {
  flood:        { halfLifeHours: 3    },  // ngập nước → vài giờ
  accident:     { halfLifeHours: 1    },  // tai nạn → nhanh
  construction: { halfLifeHours: 72   },  // công trình → nhiều ngày
  traffic:      { halfLifeHours: 0.5  },  // ùn tắc → rất nhanh
  damaged_road: { halfLifeHours: 168  },  // đường hư → rất lâu
  danger:       { halfLifeHours: 168  },  // khu nguy hiểm → rất lâu
  obstacle:     { halfLifeHours: 6    },  // chướng ngại → vài giờ
};

// Màu polyline cho từng route index
const ROUTE_COLORS = ['#2f7ee0', '#f08a1c', '#12b76a', '#8a4fe0', '#e3492c'];

/* ---------------------------------------------------------------
   1. CẤU HÌNH LOẠI SỰ CỐ
--------------------------------------------------------------- */
const INCIDENT_TYPES = {
  accident:     { label: 'Tai nạn giao thông',       emoji: '🔴', color: '#e3492c' },
  flood:        { label: 'Ngập nước',                emoji: '🔵', color: '#2f7ee0' },
  construction: { label: 'Công trình đang thi công', emoji: '🟠', color: '#f08a1c' },
  traffic:      { label: 'Ùn tắc',                   emoji: '🟡', color: '#f4b400' },
  danger:       { label: 'Khu vực nguy hiểm',        emoji: '⚠️', color: '#8a4fe0' },
  damaged_road: { label: 'Đường hư hỏng',            emoji: '🟤', color: '#8d6e63' },
  obstacle:     { label: 'Chướng ngại vật',          emoji: '🟣', color: '#7c4dff' },
};
const LEVEL_LABEL = { thap: 'Thấp', trungbinh: 'Trung bình', cao: 'Cao' };

let incidents = [];

/* ---------------------------------------------------------------
   3. TRẠNG THÁI CHUNG
--------------------------------------------------------------- */
let map, incidentLayerGroup, routeLayerGroup, transportFallbackLayerGroup;
let selectedMode = 'balanced';

// Start / end
let startLocation = { lat: 10.7725, lng: 106.6980, label: 'Chợ Bến Thành', source: 'default' };
let endLocation = null;
let startMarker = null;
let endMarker = null;
let startSearchTimer = null;
let endSearchTimer = null;
let startSearchToken = 0;
let endSearchToken = 0;
let isFindingRoute = false;
let currentRoutes = [];
let selectedRouteId = null;
let transportFallback = null;

// Mini map báo cáo — hoàn toàn độc lập với bản đồ chính
let reportMap = null;
let reportMarker = null;
let reportMapInitialized = false;
let reportSelectedLatLng = null;  // tọa độ người dùng chọn trên mini map
let reportSearchTimer = null;
let reportSearchToken = 0;

/* ---------------------------------------------------------------
   4. UTILITY
--------------------------------------------------------------- */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
}

function shortenDisplayName(dn) {
  return String(dn).split(',').map(p => p.trim()).slice(0, 3).join(', ');
}

function isValidCoordinate(lat, lng) {
  return Number.isFinite(+lat) && Number.isFinite(+lng)
    && +lat >= -90 && +lat <= 90 && +lng >= -180 && +lng <= 180;
}

/** Khoảng cách Haversine (m) */
function haversineMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
// Alias đồng nhất với tên dùng trong addOrConfirmIncident
const distanceMeters = haversineMeters;

/** Tìm khoảng cách nhỏ nhất từ điểm đến polyline */
function minDistanceToPolyline(lat, lng, coords) {
  let min = Infinity;
  for (const c of coords) {
    const d = haversineMeters(lat, lng, c[0], c[1]);
    if (d < min) min = d;
  }
  return min;
}

/** Thời gian tương đối */
function formatRelativeTime(ts) {
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return 'Vừa xong';
  if (mins < 60) return `${mins} phút trước`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs} giờ trước`;
  return `${Math.floor(hrs / 24)} ngày trước`;
}

/* ---------------------------------------------------------------
   5. CONFIDENCE — decay và tính toán
--------------------------------------------------------------- */
/**
 * Tính confidence hiện tại của incident dựa trên thời gian thực.
 * Công thức: C(t) = C_last * 0.5^(elapsedHours / halfLife)
 * Lưu thời gian thay vì giảm theo timer → đúng kể cả khi đóng/mở lại trình duyệt.
 */
function calculateCurrentConfidence(incident, now = Date.now()) {
  const cfg = INCIDENT_DECAY_CONFIG[incident.type] ?? { halfLifeHours: 24 };
  const lastActivity = incident.lastConfirmedAt ?? incident.createdAt;
  const elapsedHours = (now - lastActivity) / (1000 * 60 * 60);
  const c = incident.confidence * Math.pow(0.5, elapsedHours / cfg.halfLifeHours);
  return Math.max(0, Math.min(100, c));
}

/** Màu confidence */
function getConfidenceColor(c) {
  if (c >= 70) return 'var(--risk-low)';
  if (c >= 40) return 'var(--risk-mid)';
  return 'var(--risk-high)';
}

/* ---------------------------------------------------------------
   6. CLEANUP INCIDENTS HẾT HẠN
--------------------------------------------------------------- */
function cleanupExpiredIncidents() {
  const now = Date.now();
  const before = incidents.length;
  incidents = incidents.filter(inc => {
    const c = calculateCurrentConfidence(inc, now);
    inc.confidence = c; // cập nhật vào object để render chính xác
    return c > 0.1;
  });
  if (incidents.length !== before) renderIncidents();
  renderNearbyPanel();
}

// Chạy định kỳ mỗi 60 giây
setInterval(cleanupExpiredIncidents, 60 * 1000);

/* ---------------------------------------------------------------
   7. addOrConfirmIncident — logic báo cáo và gộp
   Khi triển khai thật: thay bằng POST /api/incidents
--------------------------------------------------------------- */
function addOrConfirmIncident(data) {
  cleanupExpiredIncidents();

  // Tìm incident cùng loại, gần vị trí, còn sống
  const nearby = incidents.find(inc => {
    if (inc.type !== data.type) return false;
    const c = calculateCurrentConfidence(inc);
    if (c <= 0) return false;
    return distanceMeters(inc.lat, inc.lng, data.lat, data.lng) <= INCIDENT_MERGE_RADIUS_METERS;
  });

  if (nearby) {
    // Chống spam: không cộng nếu cùng user
    if (nearby.reporterIds && nearby.reporterIds.includes(DEMO_USER_ID)) {
      showToast('Bạn đã báo cáo sự cố này rồi.');
      return;
    }
    // Cộng +50% vào confidence hiện tại (sau decay)
    const currentC = calculateCurrentConfidence(nearby);
    nearby.confidence = Math.min(100, currentC + 50);
    nearby.lastConfirmedAt = Date.now();
    nearby.reporterCount = (nearby.reporterCount ?? 1) + 1;
    nearby.reporterIds = [...(nearby.reporterIds ?? []), DEMO_USER_ID];
    renderIncidents();
    renderNearbyPanel();
    showToast(`Đã xác nhận sự cố. Độ tin cậy: ${Math.round(nearby.confidence)}%`);
    return;
  }

  // Tạo incident mới — confidence bắt đầu 50%
  const newInc = {
    id: (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'inc-' + Date.now(),
    type: data.type,
    level: data.level,
    lat: data.lat,
    lng: data.lng,
    desc: data.desc,
    confidence: 50,
    reporterCount: 1,
    reporterIds: [DEMO_USER_ID],
    createdAt: Date.now(),
    lastConfirmedAt: Date.now(),
  };
  incidents.push(newInc);
  renderIncidents();
  renderNearbyPanel();
}

/* ---------------------------------------------------------------
   8. KHỞI TẠO BẢN ĐỒ CHÍNH
--------------------------------------------------------------- */
function initMap() {
  map = L.map('map', { zoomControl: false }).setView([10.7769, 106.7009], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; SafeRoute built by IzekNguyen', maxZoom: 19
  }).addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  incidentLayerGroup = L.layerGroup().addTo(map);
  routeLayerGroup = L.layerGroup().addTo(map);
  transportFallbackLayerGroup = L.layerGroup().addTo(map);

  // Theo dõi chính xác sự khác biệt giữa TAP/CLICK và DRAG/ZOOM trên bản đồ lớn
  let mapWasDragged = false;
  let pointerDownPos = null;

  const mapEl = document.getElementById('map');
  if (mapEl) {
    mapEl.addEventListener('pointerdown', e => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
      mapWasDragged = false;
    }, { passive: true });

    mapEl.addEventListener('pointermove', e => {
      if (!pointerDownPos) return;
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      if (Math.hypot(dx, dy) > 8) {
        mapWasDragged = true;
      }
    }, { passive: true });

    const clearPointer = () => {
      setTimeout(() => {
        pointerDownPos = null;
        mapWasDragged = false;
      }, 150);
    };
    mapEl.addEventListener('pointerup', clearPointer, { passive: true });
    mapEl.addEventListener('pointercancel', clearPointer, { passive: true });
  }

  map.on('movestart zoomstart dragstart', () => {
    mapWasDragged = true;
  });
  map.on('moveend zoomend dragend', () => {
    setTimeout(() => {
      mapWasDragged = false;
    }, 150);
  });

  // Bản đồ lớn: CLICK/TAP trực tiếp vào vùng bản đồ trống để chọn điểm bắt đầu
  map.on('click', function (e) {
    // 1. Nếu vừa kéo hoặc zoom bản đồ -> tuyệt đối KHÔNG chọn vị trí
    if (mapWasDragged) return;

    // 2. Không làm ảnh hưởng khi bấm vào marker, popup, control
    const target = e.originalEvent?.target;
    if (target && target.closest('.leaflet-marker-icon, .leaflet-popup, .leaflet-control, .transport-hub-combo, #report-fab')) {
      return;
    }

    // 3. Chọn điểm bắt đầu trực tiếp tại tọa độ click/tap
    selectStartFromMap(e.latlng);
  });

  renderIncidents();
  renderNearbyPanel();

  if (startLocation) updateStartMarker(startLocation.lat, startLocation.lng, startLocation.label);
  initStartLocationControls();
  initEndLocationControls();
  initReportLocationControls();
  initBottomSheetGestures();
}

function handleGpsClick() {
  if (!navigator.geolocation) { showToast('Trình duyệt không hỗ trợ định vị.'); return; }
  const btn = document.getElementById('gps-btn');
  btn.classList.add('loading');
  navigator.geolocation.getCurrentPosition(
    pos => {
      btn.classList.remove('loading');
      setStartLocation(pos.coords.latitude, pos.coords.longitude, 'Vị trí hiện tại', 'gps');
      map.setView([pos.coords.latitude, pos.coords.longitude], 16);
      showToast('Đã lấy vị trí hiện tại.');
    },
    err => {
      btn.classList.remove('loading');
      const msgs = {
        [err.PERMISSION_DENIED]: 'Bạn chưa cho phép truy cập vị trí.',
        [err.POSITION_UNAVAILABLE]: 'Không thể xác định vị trí hiện tại.',
        [err.TIMEOUT]: 'Lấy vị trí quá lâu, vui lòng thử lại.',
      };
      showToast(msgs[err.code] ?? 'Không thể lấy vị trí hiện tại.');
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

function selectStartFromMap(latlng) {
  const { lat, lng } = latlng;
  const fallback = lat.toFixed(5) + ', ' + lng.toFixed(5);
  setStartLocation(lat, lng, fallback, 'map');
  reverseGeocodeStartLabel(lat, lng);
  showToast('Đã chọn điểm bắt đầu trên bản đồ.');
  if (window.innerWidth <= 820) {
    openSheet();
  }
}

function reverseGeocodeStartLabel(lat, lng) {
  fetch('https://nominatim.openstreetmap.org/reverse?' + new URLSearchParams({
    format: 'json', lat: String(lat), lon: String(lng), zoom: '18', addressdetails: '1'
  }), { headers: { 'Accept-Language': 'vi' } })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!startLocation || startLocation.lat !== lat || startLocation.lng !== lng) return;
      if (d?.display_name) {
        const lbl = shortenDisplayName(d.display_name);
        startLocation.label = lbl;
        document.getElementById('start-input').value = lbl;
        if (startMarker) {
          startMarker.bindPopup(`
            <div class="popup-box">
              <div class="p-head"><i class="fa-solid fa-location-dot" style="color:var(--primary)"></i> Điểm bắt đầu</div>
              <div class="p-row"><b>${escapeHtml(lbl)}</b></div>
            </div>`);
        }
      }
    }).catch(() => {});
}

async function searchStartLocation(query) {
  const token = ++startSearchToken;
  try {
    const res = await fetch('https://nominatim.openstreetmap.org/search?' + new URLSearchParams({
      format: 'json', q: query, limit: '5', countrycodes: 'vn', addressdetails: '1'
    }), { headers: { 'Accept-Language': 'vi' } });
    if (token !== startSearchToken) return;
    if (!res.ok) throw new Error();
    const results = await res.json();
    if (token !== startSearchToken) return;
    renderStartSuggestions(results);
  } catch { if (token !== startSearchToken) return; showToast('Không thể tìm địa điểm.'); }
}

function renderStartSuggestions(results) {
  const box = document.getElementById('start-suggestions');
  if (!results?.length) {
    box.innerHTML = '<li class="suggestion-empty">Không tìm thấy địa điểm phù hợp.</li>';
    box.classList.remove('hidden'); return;
  }
  box.innerHTML = results.map((r, i) => {
    const s = shortenDisplayName(r.display_name);
    const m = s.split(',')[0], sub = s.split(',').slice(1).join(',').trim();
    return `<li class="suggestion-item" role="option" data-index="${i}">
      <i class="fa-solid fa-location-dot"></i>
      <div><div class="s-main">${escapeHtml(m)}</div>${sub ? `<div class="s-sub">${escapeHtml(sub)}</div>` : ''}</div>
    </li>`;
  }).join('');
  box.classList.remove('hidden');
  document.getElementById('start-input').setAttribute('aria-expanded', 'true');
  box.querySelectorAll('.suggestion-item[data-index]').forEach(item => {
    item.addEventListener('click', () => {
      const r = results[+item.dataset.index];
      setStartLocation(+r.lat, +r.lon, shortenDisplayName(r.display_name), 'search');
      map.setView([+r.lat, +r.lon], 16); hideStartSuggestions();
      showToast('Đã chọn điểm bắt đầu.');
    });
  });
}

const PHU_QUOC_POLYGON = [
  [9.95, 103.80], [10.50, 103.80], [10.50, 104.20], [9.95, 104.20]

function pointInPolygon(lat, lng, polygon) {
  let inside = false;
  for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
    const xi = polygon[i][0], yi = polygon[i][1];
    const xj = polygon[j][0], yj = polygon[j][1];
    const intersect = ((yi > lng) !== (yj > lng))
        && (lat < (xj - xi) * (lng - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function isPointInVietnam(lat, lng) {
  return pointInPolygon(lat, lng, VIETNAM_MAINLAND_POLYGON) ||
         pointInPolygon(lat, lng, PHU_QUOC_POLYGON);
}

function isRouteInsideVietnam(route) {
  const coords = route.coords;
  if (!coords || coords.length === 0) return false;
  const step = Math.max(1, Math.floor(coords.length / 120));
  for (let i = 0; i < coords.length; i += step) {
    if (!isPointInVietnam(coords[i][0], coords[i][1])) {
      return false;
    }
  }
  if (!isPointInVietnam(coords[coords.length - 1][0], coords[coords.length - 1][1])) {
    return false;
  }
  return true;
}

async function fetchOsrmRawRoute(waypoints) {
  const coordStr = waypoints.map(p => `${p.lng},${p.lat}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson&steps=true&alternatives=true`;
  const res = await fetch(url);
  if (!res.ok) return [];
  const data = await res.json();
  if (data.code !== 'Ok' || !data.routes?.length) return [];
  return data.routes.map((route, index) => ({
    coords: route.geometry.coordinates.map(([lng, lat]) => [lat, lng]),
    distance: route.distance / 1000,
    duration: route.duration / 60,
    legs: route.legs,
    routeIndex: index,
    riskScore: 0,
  }));
}

async function findSafeRoutes(start, end) {
  // 1. Thử lấy tuyến trực tiếp start -> end
  const initialRoutes = await fetchOsrmRawRoute([start, end]);
  let validRoutes = initialRoutes.filter(r => isRouteInsideVietnam(r));

  // 2. Nếu không có tuyến nào hoàn toàn trong VN (OSRM đi qua Lào/Campuchia)
  // Thử các waypoint thuộc hành lang giao thông nội địa Việt Nam (QL1A/CT01)
  if (validRoutes.length === 0) {
    const minLat = Math.min(start.lat, end.lat);
    const maxLat = Math.max(start.lat, end.lat);
    const candidateWps = [
      { lat: 16.0544, lng: 108.2022 }, // Đà Nẵng
      { lat: 13.7830, lng: 109.2197 }, // Quy Nhơn
      { lat: 18.6796, lng: 105.6813 }, // Vinh
      { lat: 12.2388, lng: 109.1967 }, // Nha Trang
    ].filter(wp => wp.lat > minLat + 0.3 && wp.lat < maxLat - 0.3);

    for (const wp of candidateWps) {
      const fallbackRoutes = await fetchOsrmRawRoute([start, wp, end]);
      const validFallback = fallbackRoutes.filter(r => isRouteInsideVietnam(r));
      if (validFallback.length > 0) {
        validRoutes = validFallback;
        break;
      }
    }
  }

  // 3. Nếu vẫn không có tuyến hợp lệ
  if (!validRoutes.length) {
    throw new Error('Không tìm thấy tuyến đường hợp lệ trong lãnh thổ Việt Nam.');
  }

  // Gán ID (A, B, C...) và routeIndex cho các tuyến hợp lệ
  return validRoutes.map((route, index) => ({
    ...route,
    id: String.fromCharCode(65 + index),
    routeIndex: index,
  }));
}

async function fetchOsmDynamicHubs(start) {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 1800);
    const box = `${start.lng - 2.5},${start.lat + 2.5},${start.lng + 2.5},${start.lat - 2.5}`;
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=aeroway=aerodrome&countrycodes=vn&limit=3&viewbox=${box}&bounded=1`;
    const res = await fetch(url, { signal: controller.signal, headers: { 'Accept-Language': 'vi' } });
    clearTimeout(timeoutId);
    if (!res.ok) return [];
    const list = await res.json();
    return list.map(item => ({
      name: item.name || shortenDisplayName(item.display_name),
      lat: +item.lat,
      lng: +item.lon,
      type: 'airport'
    })).filter(h => isValidCoordinate(h.lat, h.lng));
  } catch (e) {
    return [];
  }
}

async function findTransportFallback(start, end) {
  const totalDirectDist = haversineMeters(start.lat, start.lng, end.lat, end.lng) / 1000;

  let dynamicHubs = [];
  try {
    dynamicHubs = await fetchOsmDynamicHubs(start);
  } catch (e) {}

  const seen = new Set();
  const allHubs = [];
  for (const h of [...dynamicHubs, ...OSM_VERIFIED_HUBS]) {
    const key = `${h.lat.toFixed(3)},${h.lng.toFixed(3)}`;
    if (seen.has(key)) continue;
    seen.add(key);
    allHubs.push(h);
  }

  // 1. Tìm các ứng viên Origin Hub (gần start)
  const originCandidates = [];
  for (const h of allHubs) {
    const dStart = haversineMeters(start.lat, start.lng, h.lat, h.lng) / 1000;
    const dEnd = haversineMeters(h.lat, h.lng, end.lat, end.lng) / 1000;

    // Loại bỏ hub đi ngược hướng quá nhiều (dEnd > totalDirectDist + 40km),
    // trừ khi điểm bắt đầu rất gần hub (dStart <= 30km)
    if (dEnd > totalDirectDist + 40 && dStart > 30) continue;

    let score = dStart * 1.5 + dEnd * 0.8;
    if (totalDirectDist > 350 && h.type === 'airport') {
      score -= 40;
    }
    originCandidates.push({ ...h, dStart, dEnd, score });
  }

  originCandidates.sort((a, b) => a.score - b.score);

  // 2. Thử các ứng viên Origin Hub hàng đầu
  for (const originHub of originCandidates.slice(0, 6)) {
    try {
      const roadToOriginRoutes = await fetchOsrmRawRoute([start, { lat: originHub.lat, lng: originHub.lng }]);
      const validRoadToOrigin = roadToOriginRoutes.filter(r => isRouteInsideVietnam(r));
      if (validRoadToOrigin.length === 0) continue;

      const roadToOriginHub = validRoadToOrigin[0];

      // 3. Với Origin Hub này, tìm Destination Hub riêng gần điểm đích (end)
      // Tính khoảng cách từ từng hub tới end
      const destCandidates = [];
      for (const h of allHubs) {
        // Không được chọn cùng một hub
        const sameHub = Math.abs(originHub.lat - h.lat) < 0.001 && Math.abs(originHub.lng - h.lng) < 0.001;
        if (sameHub) continue;

        const dEnd = haversineMeters(h.lat, h.lng, end.lat, end.lng) / 1000;
        // Ưu tiên cùng loại hình trung chuyển với originHub (máy bay đi với máy bay, tàu hỏa đi với tàu hỏa)
        const typePenalty = (h.type === originHub.type) ? 0 : 500;
        destCandidates.push({ ...h, dEnd, sortKey: typePenalty + dEnd });
      }

      // Sắp xếp tăng dần: ưu tiên cùng loại và gần end nhất
      destCandidates.sort((a, b) => a.sortKey - b.sortKey);

      // Thử các ứng viên Destination Hub để tìm đường bộ hợp lệ đến end
      for (const destinationHub of destCandidates.slice(0, 8)) {
        try {
          const roadFromDestRoutes = await fetchOsrmRawRoute([
            { lat: destinationHub.lat, lng: destinationHub.lng },
            end
          ]);
          const validRoadFromDest = roadFromDestRoutes.filter(r => isRouteInsideVietnam(r));
          if (validRoadFromDest.length === 0) continue;

          const roadFromDestinationHub = validRoadFromDest[0];

          // Cả 2 chặng đường bộ đều hợp lệ trong Việt Nam!
          roadToOriginHub.riskScore = calculateRouteRisk(roadToOriginHub);
          roadFromDestinationHub.riskScore = calculateRouteRisk(roadFromDestinationHub);

          const transitDist = haversineMeters(
            originHub.lat,
            originHub.lng,
            destinationHub.lat,
            destinationHub.lng
          ) / 1000;

          const transitType = (originHub.type === 'airport' && destinationHub.type === 'airport') ? 'airport' :
                              (originHub.type === 'railway' && destinationHub.type === 'railway') ? 'railway' :
                              (originHub.type === 'airport' || destinationHub.type === 'airport') ? 'airport' : 'railway';

          let estDuration = 0;
          if (transitType === 'airport') {
            estDuration = Math.round(45 + (transitDist / 600) * 60);
          } else {
            estDuration = Math.round((transitDist / 60) * 60);
          }

          return {
            originHub,
            destinationHub,
            roadToOriginHub,
            transit: {
              from: originHub,
              to: destinationHub,
              distance: transitDist,
              estimatedDuration: estDuration,
              type: transitType
            },
            roadFromDestinationHub
          };
        } catch (destRouteErr) {
          // Thử destination hub tiếp theo
        }
      }
    } catch (originRouteErr) {
      // Thử origin hub tiếp theo
    }
  }

  return null;
}

/* ---------------------------------------------------------------
   13. RISK SCORE từ incident thật gần route
--------------------------------------------------------------- */
function calculateRouteRisk(route) {
  let raw = 0;
  for (const inc of incidents) {
    const c = calculateCurrentConfidence(inc);
    if (c <= 0) continue;
    const distM = minDistanceToPolyline(inc.lat, inc.lng, route.coords);
    let distW = 0;
    if (distM < RISK_IMPACT.STRONG_THRESHOLD_M) distW = RISK_IMPACT.STRONG_WEIGHT;
    else if (distM < RISK_IMPACT.MEDIUM_THRESHOLD_M) distW = RISK_IMPACT.MEDIUM_WEIGHT;
    if (distW === 0) continue;
    raw += distW * (INCIDENT_TYPE_WEIGHT[inc.type] ?? 0.1) * (INCIDENT_LEVEL_WEIGHT[inc.level] ?? 0.2) * (c / 100);
  }
  return Math.min(100, Math.round((raw / 3.0) * 100));
}

/* ---------------------------------------------------------------
   14. SẮP XẾP ROUTE THEO CHẾ ĐỘ
--------------------------------------------------------------- */
const MODE_ALPHA = { fastest: 0, balanced: 1, safest: 3 };
function sortRoutesByMode(routes, mode) {
  const alpha = MODE_ALPHA[mode] ?? 1;
  return [...routes].sort((a, b) => {
    const wA = a.duration * (1 + alpha * a.riskScore / 100);
    const wB = b.duration * (1 + alpha * b.riskScore / 100);
    return wA - wB;
  });
}

/* ---------------------------------------------------------------
   15. HƯỚNG DẪN TỪNG BƯỚC (OSRM steps)
--------------------------------------------------------------- */
function buildStepInstruction(step) {
  const type = step.maneuver?.type ?? '';
  const mod = step.maneuver?.modifier ?? '';
  const name = step.name ? `đường ${step.name}` : 'tiếp tục';
  const map2 = {
    depart: '🚦 Xuất phát', arrive: '🏁 Đến điểm đích',
    turn: mod.includes('left') ? '↰ Rẽ trái vào' : '↱ Rẽ phải vào',
    'new name': '➡️ Đổi sang', merge: '↗️ Nhập vào',
    fork: mod.includes('left') ? '↰ Rẽ trái tại ngã ba' : '↱ Rẽ phải tại ngã ba',
    'end of road': mod.includes('left') ? '↰ Rẽ trái' : '↱ Rẽ phải',
    continue: '⬆️ Đi thẳng', roundabout: '🔄 Vào vòng xuyến',
    rotary: '🔄 Vào vòng xuyến',
  };
  const prefix = map2[type] ?? '➡️ Đi';
  return type === 'arrive' ? prefix : `${prefix} ${name}`;
}

function buildStepsHtml(legs) {
  if (!legs?.length) return '';
  const steps = legs.flatMap(leg => leg.steps ?? []);
  if (!steps.length) return '';
  return `<details class="route-steps-details">
    <summary><i class="fa-solid fa-list-ul"></i> Xem hướng dẫn chi tiết</summary>
    <ul class="route-steps">
      ${steps.map(s => {
        const dist = s.distance >= 1000
          ? (s.distance/1000).toFixed(1)+' km'
          : Math.round(s.distance)+' m';
        return `<li class="route-step">
          <span class="step-instr">${escapeHtml(buildStepInstruction(s))}</span>
          <span class="step-dist">${dist}</span>
        </li>`;
      }).join('')}
    </ul>
  </details>`;
}

/* ---------------------------------------------------------------
   16. RENDER SỰ CỐ TRÊN BẢN ĐỒ CHÍNH
--------------------------------------------------------------- */
function renderIncidents() {
  incidentLayerGroup.clearLayers();
  const now = Date.now();

  for (const inc of incidents) {
    const currentC = calculateCurrentConfidence(inc, now);
    if (currentC <= 0.1) continue;

    const meta = INCIDENT_TYPES[inc.type];
    const opacity = Math.max(0.25, currentC / 100);
    const confColor = getConfidenceColor(currentC);
    const levelColor = inc.level === 'cao' ? 'var(--risk-high)' : inc.level === 'trungbinh' ? 'var(--risk-mid)' : 'var(--risk-low)';

    const icon = L.divIcon({
      className: '',
      html: `<div class="incident-marker" style="border-color:${meta.color};opacity:${opacity}"><span>${meta.emoji}</span></div>`,
      iconSize: [30, 30], iconAnchor: [15, 28]
    });

    const marker = L.marker([inc.lat, inc.lng], { icon, opacity }).addTo(incidentLayerGroup);

    marker.bindPopup(`
      <div class="popup-box">
        <div class="p-head">${meta.emoji} ${meta.label}</div>
        <div class="confidence-bar"><div class="confidence-fill" style="width:${Math.round(currentC)}%;background:${confColor}"></div></div>
        <div class="p-row"><span>Độ tin cậy</span><b style="color:${confColor}">${Math.round(currentC)}%</b></div>
        <div class="p-row"><span>Báo cáo</span><b>${inc.reporterCount ?? 1} người</b></div>
        <div class="p-row"><span>Mô tả</span><b>${escapeHtml(inc.desc)}</b></div>
        <div class="p-row"><span>Cập nhật</span><b>${formatRelativeTime(inc.lastConfirmedAt ?? inc.createdAt)}</b></div>
        <span class="p-level" style="background:${levelColor}22;color:${levelColor}">
          Mức độ: ${LEVEL_LABEL[inc.level]}
        </span>
      </div>`);
  }
}

/* ---------------------------------------------------------------
   17. RENDER PANEL "CẢNH BÁO GẦN BẠN"
   Dựa trên startLocation, incidents thật, confidence > 0.1 và khoảng cách <= 3000m
--------------------------------------------------------------- */
const NEARBY_ALERT_RADIUS_METERS = 3000;

function formatDistance(meters) {
  if (meters < 1000) {
    return `${Math.round(meters)}m`;
  }
  return `${(meters / 1000).toFixed(1)}km`;
}

function renderNearbyPanel() {
  const listEl = document.getElementById('nearby-list');
  if (!listEl) return;

  if (!startLocation || !isValidCoordinate(startLocation.lat, startLocation.lng)) {
    listEl.innerHTML = '<div class="np-empty" style="font-size:12px;color:var(--text-muted);padding:4px 0;">Chưa xác định vị trí.</div>';
    return;
  }

  const now = Date.now();
  const validNearby = [];

  for (const inc of incidents) {
    const currentC = calculateCurrentConfidence(inc, now);
    if (currentC <= 0.1) continue;

    const distM = haversineMeters(startLocation.lat, startLocation.lng, inc.lat, inc.lng);
    if (distM <= NEARBY_ALERT_RADIUS_METERS) {
      validNearby.push({
        incident: inc,
        distance: distM
      });
    }
  }

  if (validNearby.length === 0) {
    listEl.innerHTML = '<div class="np-empty" style="font-size:12px;color:var(--text-muted);padding:4px 0;">Không có cảnh báo gần bạn.</div>';
    return;
  }

  // Sắp xếp gần -> xa
  validNearby.sort((a, b) => a.distance - b.distance);

  // Giới hạn 5 cảnh báo gần nhất
  const topNearby = validNearby.slice(0, 5);

  listEl.innerHTML = topNearby.map(item => {
    const inc = item.incident;
    const meta = INCIDENT_TYPES[inc.type] || { emoji: '⚠️', label: 'Sự cố' };
    return `<div class="np-item">
      <span class="np-label">${meta.emoji} ${escapeHtml(meta.label)}</span>
      <span class="np-dist">${formatDistance(item.distance)}</span>
    </div>`;
  }).join('');
}

/* ---------------------------------------------------------------
   18. RENDER ROUTES
--------------------------------------------------------------- */
function renderRoutes(routes, mode) {
  routeLayerGroup.clearLayers();
  const sorted = sortRoutesByMode(routes, mode);
  const bounds = [];

  // Giữ tuyến đang chọn nếu còn trong danh sách, ngược lại chọn tuyến đề xuất (đầu tiên)
  if (!selectedRouteId || !sorted.some(r => r.id === selectedRouteId)) {
    selectedRouteId = sorted[0]?.id ?? null;
  }

  sorted.forEach((route, idx) => {
    const isSelected = route.id === selectedRouteId;
    const isRecommended = idx === 0;
    const color = ROUTE_COLORS[route.routeIndex] ?? ROUTE_COLORS[0];
    const line = L.polyline(route.coords, {
      color,
      weight: isSelected ? 6 : 4,
      opacity: isSelected ? 0.95 : 0.55,
      dashArray: isSelected ? null : '2 8'
    }).addTo(routeLayerGroup);

    if (isSelected) {
      line.bringToFront();
    }

    line.bindTooltip(
      `Tuyến ${route.id} · ${route.distance.toFixed(1)} km · ${Math.round(route.duration)} phút${isSelected ? ' (Đang chọn)' : ''}`,
      { sticky: true }
    );
    route.coords.forEach(c => bounds.push(c));
  });

  if (bounds.length) map.fitBounds(bounds, { padding: [60, 60] });

  const resultsEl = document.getElementById('route-results');
  resultsEl.classList.add('show');
  const modeName = mode === 'fastest' ? 'NHANH NHẤT' : mode === 'balanced' ? 'CÂN BẰNG' : 'AN TOÀN NHẤT';
  resultsEl.innerHTML = `<p class="panel-title" style="margin-top:4px;">KẾT QUẢ TUYẾN ĐƯỜNG</p>
    <p class="routes-summary">Tìm thấy ${sorted.length} tuyến đường</p>` +
    sorted.map((route, idx) => {
      const isSelected = route.id === selectedRouteId;
      const isRecommended = idx === 0;
      const rc = route.riskScore >= 66 ? 'var(--risk-high)' : route.riskScore >= 34 ? 'var(--risk-mid)' : 'var(--risk-low)';
      const color = ROUTE_COLORS[route.routeIndex] ?? ROUTE_COLORS[0];
      return `<div class="route-card ${isSelected ? 'best selected' : ''}">
        <div class="route-card-head">
          <span class="title" style="color:${color}">● Tuyến ${route.id}</span>
          ${isRecommended ? `<span class="badge">Đề xuất (${modeName})</span>` : ''}
        </div>
        <div class="route-stats">
          <div class="stat"><b>${route.distance.toFixed(1)} km</b><span>Quãng đường</span></div>
          <div class="stat"><b>${Math.round(route.duration)} phút</b><span>Thời gian</span></div>
        </div>
        <div class="risk-row">
          <div class="risk-bar-track"><div class="risk-bar-fill" style="width:${route.riskScore}%;background:${rc}"></div></div>
          <span class="risk-value" style="color:${rc}">${route.riskScore}/100</span>
        </div>
        ${buildStepsHtml(route.legs)}
        ${isSelected
          ? `<button class="choose-btn selected" style="background:var(--primary);color:#fff;cursor:default;">✓ Đang chọn</button>`
          : `<button class="choose-btn" onclick="chooseRoute('${route.id}')">Chọn tuyến này</button>`
        }
      </div>`;
    }).join('');
}

function chooseRoute(id) {
  const target = currentRoutes.find(r => r.id === id);
  if (!target) return;
  selectedRouteId = id;
  renderRoutes(currentRoutes, selectedMode);
  showToast(`Đã chọn Tuyến ${id}. Bắt đầu chỉ đường...`);
}

/* ---------------------------------------------------------------
   19. NÚT "TÌM ĐƯỜNG AN TOÀN"
--------------------------------------------------------------- */
async function onFindRouteClick() {
  if (isFindingRoute) return;

  const endText = document.getElementById('end-input').value.trim();
  if (!startLocation || !isValidCoordinate(startLocation.lat, startLocation.lng)) {
    showToast('Vui lòng chọn điểm bắt đầu hợp lệ.'); return;
  }
  if (!endText) { showToast('Vui lòng nhập điểm đến.'); return; }

  // Reset kết quả và các layer fallback trước đó
  transportFallbackLayerGroup?.clearLayers();
  transportFallback = null;

  isFindingRoute = true;
  setFindButtonLoading(true, 'Đang tìm tuyến đường...');

  try {
    // Geocode fallback nếu chưa chọn gợi ý
    if (!endLocation) {
      setFindButtonLoading(true, 'Đang xác định địa điểm...');
      const res = await fetch('https://nominatim.openstreetmap.org/search?' + new URLSearchParams({
        format: 'json', q: endText, limit: '1', countrycodes: 'vn', addressdetails: '1'
      }), { headers: { 'Accept-Language': 'vi' } });
      if (!res.ok) throw new Error('Nominatim error');
      const results = await res.json();
      if (!results?.length) { showToast('Không tìm thấy địa điểm. Vui lòng chọn từ danh sách gợi ý.'); return; }
      const r = results[0];
      if (!isValidCoordinate(+r.lat, +r.lon)) { showToast('Không tìm thấy điểm đến hợp lệ.'); return; }
      endLocation = { lat: +r.lat, lng: +r.lon, label: shortenDisplayName(r.display_name), source: 'fallback' };
      document.getElementById('end-input').value = endLocation.label;
      updateEndMarker(endLocation.lat, endLocation.lng, endLocation.label);
      setFindButtonLoading(true, 'Đang tìm tuyến đường...');
    }

    const dist = haversineMeters(startLocation.lat, startLocation.lng, endLocation.lat, endLocation.lng);
    if (dist < 50) { showToast('Điểm bắt đầu và điểm đến không được giống nhau.'); return; }

    cleanupExpiredIncidents();
    const routes = await findSafeRoutes(startLocation, endLocation);
    routes.forEach(r => { r.riskScore = calculateRouteRisk(r); });
    currentRoutes = routes;

    // Mặc định chọn tuyến đề xuất ban đầu (phần tử đầu tiên sau khi sắp xếp)
    const sorted = sortRoutesByMode(routes, selectedMode);
    selectedRouteId = sorted[0]?.id ?? null;

    renderRoutes(routes, selectedMode);

    if (window.innerWidth <= 820) openSheet();

  } catch (err) {
    console.error('SafeRoute error:', err);
    if (err.message === 'Không tìm thấy tuyến đường hợp lệ trong lãnh thổ Việt Nam.' || err.message === 'Không tìm thấy tuyến đường') {
      try {
        setFindButtonLoading(true, 'Đang tìm phương án trung chuyển...');
        const fallbackResult = await findTransportFallback(startLocation, endLocation);
        if (fallbackResult) {
          transportFallback = fallbackResult;
          currentRoutes = [];
          selectedRouteId = null;
          renderTransportFallback(fallbackResult);
          showToast('Đang đề xuất phương án kết hợp trung chuyển.');
          if (window.innerWidth <= 820) openSheet();
          return;
        }
      } catch (fbErr) {
        console.error('Lỗi tìm phương án trung chuyển:', fbErr);
      }
      showToast('Không tìm thấy tuyến đường hợp lệ trong lãnh thổ Việt Nam.');
    } else {
      showToast('Không thể tìm tuyến đường. Vui lòng thử lại.');
    }
  } finally {
    isFindingRoute = false;
    setFindButtonLoading(false, 'Tìm đường an toàn');
  }
}

function setFindButtonLoading(isLoading, label) {
  const btn = document.getElementById('find-btn');
  btn.disabled = isLoading;
  document.getElementById('find-btn-label').textContent = label ?? (isLoading ? 'Đang tìm...' : 'Tìm đường an toàn');
}

/* ---------------------------------------------------------------
   20. SWAP START / END
--------------------------------------------------------------- */
function swapLocations() {
  transportFallbackLayerGroup?.clearLayers();
  transportFallback = null;
  routeLayerGroup?.clearLayers();
  currentRoutes = [];
  selectedRouteId = null;
  const resultsEl = document.getElementById('route-results');
  if (resultsEl) resultsEl.classList.remove('show');

  const si = document.getElementById('start-input');
  const ei = document.getElementById('end-input');
  const tmpText = si.value; si.value = ei.value; ei.value = tmpText;
  const tmpLoc = startLocation; startLocation = endLocation; endLocation = tmpLoc;

  if (startLocation && isValidCoordinate(startLocation.lat, startLocation.lng))
    updateStartMarker(startLocation.lat, startLocation.lng, startLocation.label);
  else { if (startMarker) { map.removeLayer(startMarker); startMarker = null; } showToast('Vui lòng chọn lại điểm bắt đầu.'); }

  if (endLocation && isValidCoordinate(endLocation.lat, endLocation.lng))
    updateEndMarker(endLocation.lat, endLocation.lng, endLocation.label);
  else { if (endMarker) { map.removeLayer(endMarker); endMarker = null; } }

  renderNearbyPanel();
}

/* ---------------------------------------------------------------
   21. CHẾ ĐỘ
--------------------------------------------------------------- */
document.getElementById('mode-group').addEventListener('change', e => {
  selectedMode = e.target.value;
  document.querySelectorAll('.mode-option').forEach(opt => {
    opt.classList.toggle('checked', opt.dataset.mode === selectedMode);
  });
  if (transportFallback) return;
  if (currentRoutes.length > 0) renderRoutes(currentRoutes, selectedMode);
});

/* ---------------------------------------------------------------
   22. MINI MAP BÁO CÁO SỰ CỐ — độc lập với bản đồ chính
--------------------------------------------------------------- */
function initReportMap() {
  if (reportMapInitialized) {
    setTimeout(() => reportMap?.invalidateSize(), 100);
    return;
  }

  reportMap = L.map('report-mini-map', {
    zoomControl: true,
    attributionControl: true
  }).setView([10.7769, 106.7009], 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(reportMap);

  // Click mini map → chọn vị trí
  reportMap.on('click', e => {
    hideReportSuggestions();
    selectReportLocation(e.latlng);
  });

  reportMapInitialized = true;
  setTimeout(() => reportMap?.invalidateSize(), 100);
}

function selectReportLocation(latlng, customLabel) {
  reportSelectedLatLng = { lat: latlng.lat, lng: latlng.lng };

  if (reportMarker) { reportMap.removeLayer(reportMarker); reportMarker = null; }

  const icon = L.divIcon({
    className: '',
    html: '<div class="report-location-marker"><i class="fa-solid fa-location-dot"></i></div>',
    iconSize: [36, 36], iconAnchor: [18, 34]
  });

  reportMarker = L.marker([latlng.lat, latlng.lng], { icon, draggable: true }).addTo(reportMap);

  // Kéo marker để tinh chỉnh vị trí
  reportMarker.on('dragend', e => {
    const pos = e.target.getLatLng();
    reportSelectedLatLng = { lat: pos.lat, lng: pos.lng };
    updateReportLocationText(pos.lat, pos.lng);
  });

  if (customLabel) {
    const input = document.getElementById('report-location');
    if (input) input.value = customLabel;
  } else {
    updateReportLocationText(latlng.lat, latlng.lng);
  }
}

async function updateReportLocationText(lat, lng) {
  const input = document.getElementById('report-location');
  if (!input) return;
  input.value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  try {
    const res = await fetch('https://nominatim.openstreetmap.org/reverse?' + new URLSearchParams({
      format: 'json', lat: String(lat), lon: String(lng), zoom: '18', addressdetails: '1'
    }), { headers: { 'Accept-Language': 'vi' } });
    if (!res.ok) return;
    const data = await res.json();
    if (data?.display_name) input.value = shortenDisplayName(data.display_name);
  } catch { /* reverse geocode thất bại — giữ lat/lng */ }
}

function useCurrentLocationForReport() {
  if (!navigator.geolocation) {
    showToast('Trình duyệt không hỗ trợ định vị.'); return;
  }
  const btn = document.getElementById('report-current-location');
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    pos => {
      btn.disabled = false;
      const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      hideReportSuggestions();
      selectReportLocation(latlng);
      if (reportMap) {
        reportMap.setView([latlng.lat, latlng.lng], 17);
      }
    },
    () => {
      btn.disabled = false;
      showToast('Không thể lấy vị trí hiện tại. Hãy chọn trực tiếp trên bản đồ.');
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

/* ---------------------------------------------------------------
   22b. AUTOCOMPLETE VỊ TRÍ BÁO CÁO SỰ CỐ
--------------------------------------------------------------- */
function initReportLocationControls() {
  const input = document.getElementById('report-location');
  if (!input) return;

  input.addEventListener('input', () => {
    // Khi gõ tay, hủy tọa độ cũ cho tới khi chọn gợi ý hoặc click bản đồ
    reportSelectedLatLng = null;
    clearTimeout(reportSearchTimer);
    const q = input.value.trim();
    if (q.length < 2) {
      hideReportSuggestions();
      return;
    }
    reportSearchTimer = setTimeout(() => searchReportLocation(q), 400);
  });
}

function hideReportSuggestions() {
  const box = document.getElementById('report-suggestions');
  if (!box) return;
  box.classList.add('hidden');
  box.innerHTML = '';
  const input = document.getElementById('report-location');
  if (input) input.setAttribute('aria-expanded', 'false');
}

async function searchReportLocation(query) {
  const token = ++reportSearchToken;
  try {
    const res = await fetch('https://nominatim.openstreetmap.org/search?' + new URLSearchParams({
      format: 'json', q: query, limit: '5', countrycodes: 'vn', addressdetails: '1'
    }), { headers: { 'Accept-Language': 'vi' } });
    if (token !== reportSearchToken) return;
    if (!res.ok) throw new Error();
    const results = await res.json();
    if (token !== reportSearchToken) return;
    renderReportSuggestions(results);
  } catch {
    if (token !== reportSearchToken) return;
    showToast('Không thể tìm địa điểm.');
  }
}

function renderReportSuggestions(results) {
  const box = document.getElementById('report-suggestions');
  const input = document.getElementById('report-location');
  if (!box || !input) return;

  if (!results?.length) {
    box.innerHTML = '<li class="suggestion-empty">Không tìm thấy địa điểm phù hợp.</li>';
    box.classList.remove('hidden');
    input.setAttribute('aria-expanded', 'true');
    return;
  }

  box.innerHTML = results.map((r, i) => {
    const s = shortenDisplayName(r.display_name);
    const m = s.split(',')[0], sub = s.split(',').slice(1).join(',').trim();
    return `<li class="suggestion-item" role="option" data-index="${i}">
      <i class="fa-solid fa-location-dot"></i>
      <div><div class="s-main">${escapeHtml(m)}</div>${sub ? `<div class="s-sub">${escapeHtml(sub)}</div>` : ''}</div>
    </li>`;
  }).join('');

  box.classList.remove('hidden');
  input.setAttribute('aria-expanded', 'true');

  box.querySelectorAll('.suggestion-item[data-index]').forEach(item => {
    item.addEventListener('click', () => {
      const r = results[+item.dataset.index];
      const lat = +r.lat;
      const lng = +r.lon;
      const label = shortenDisplayName(r.display_name);

      input.value = label;
      hideReportSuggestions();

      selectReportLocation({ lat, lng }, label);
      if (reportMap) {
        reportMap.setView([lat, lng], 16);
      }
    });
  });
}

/* ---------------------------------------------------------------
   23. MỞ / ĐÓNG MODAL BÁO CÁO
--------------------------------------------------------------- */
function openReportModal() {
  reportSelectedLatLng = null;
  const input = document.getElementById('report-location');
  if (input) input.value = '';
  hideReportSuggestions();
  document.getElementById('report-modal').classList.remove('hidden');

  setTimeout(() => {
    initReportMap();
    if (reportMap) {
      reportMap.invalidateSize();
      // Ưu tiên hiển thị vị trí bắt đầu hiện tại nếu có
      if (startLocation && isValidCoordinate(startLocation.lat, startLocation.lng)) {
        reportMap.setView([startLocation.lat, startLocation.lng], 15);
      }
    }
  }, 150);
}

function closeReportModal() {
  document.getElementById('report-modal').classList.add('hidden');
  reportSelectedLatLng = null;
  hideReportSuggestions();
  if (reportMarker && reportMap) {
    reportMap.removeLayer(reportMarker);
    reportMarker = null;
  }
  const input = document.getElementById('report-location');
  if (input) input.value = '';
  // Reset form
  document.getElementById('report-desc').value = '';
  // Reset level pills
  document.querySelectorAll('.level-pill').forEach(p => p.classList.remove('checked'));
  document.querySelector('.level-pill.low')?.classList.add('checked');
  const lowInput = document.querySelector('input[name="level"][value="thap"]');
  if (lowInput) lowInput.checked = true;
}

document.getElementById('level-group').addEventListener('change', e => {
  document.querySelectorAll('.level-pill').forEach(p => p.classList.remove('checked'));
  e.target.closest('.level-pill').classList.add('checked');
});

/* ---------------------------------------------------------------
   24. SUBMIT REPORT — bắt buộc vị trí hợp lệ
--------------------------------------------------------------- */
function submitReport() {
  if (!reportSelectedLatLng || !isValidCoordinate(reportSelectedLatLng.lat, reportSelectedLatLng.lng)) {
    showToast('Vui lòng chọn một địa chỉ hợp lệ từ danh sách gợi ý hoặc chọn vị trí trên bản đồ.');
    return;
  }

  const type = document.getElementById('report-type').value;
  const level = document.querySelector('input[name="level"]:checked').value;
  const desc = document.getElementById('report-desc').value.trim() || 'Không có mô tả.';

  const reportedLat = reportSelectedLatLng.lat;
  const reportedLng = reportSelectedLatLng.lng;

  addOrConfirmIncident({
    type, level,
    lat: reportedLat,
    lng: reportedLng,
    desc,
  });

  closeReportModal();
  showToast('Cảm ơn bạn! Báo cáo đã được ghi nhận.');

  // Pan bản đồ chính về vị trí sự cố để người dùng thấy marker vừa xuất hiện
  if (map) {
    map.setView([reportedLat, reportedLng], Math.max(map.getZoom(), 15));
  }
}

/* ---------------------------------------------------------------
   25. TOAST
--------------------------------------------------------------- */
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
}

/* ---------------------------------------------------------------
   26. BOTTOM SHEET (MOBILE) & GESTURES
--------------------------------------------------------------- */
let didDrag = false;

function isSheetExpanded() {
  const sidebar = document.getElementById('sidebar');
  return sidebar ? sidebar.classList.contains('expanded') : false;
}

function openSheet() {
  const sidebar = document.getElementById('sidebar');
  if (!sidebar) return;
  sidebar.style.transform = '';
  sidebar.classList.add('expanded');
}

function closeSheet() {
  const sidebar = document.getElementById('sidebar');
  if (!sidebar) return;
  sidebar.style.transform = '';
  sidebar.classList.remove('expanded');
}

function toggleSheet() {
  if (didDrag) return;
  if (isSheetExpanded()) {
    closeSheet();
  } else {
    openSheet();
  }
}

function isHandleOrTopZone(e, sidebar) {
  if (e.target.closest('.sheet-handle')) return true;
  const rect = sidebar.getBoundingClientRect();
  // Vùng 50px tính từ đỉnh của sidebar, loại trừ các phần tử tương tác
  if (e.clientY <= rect.top + 50 && !e.target.closest('input, button, select, a, textarea')) {
    return true;
  }
  return false;
}

function initBottomSheetGestures() {
  const sidebar = document.getElementById('sidebar');
  if (!sidebar) return;

  let startY = 0;
  let startX = 0;
  let startExpanded = false;
  let baseTranslate = 0;
  let maxTranslate = 0;
  let isDragging = false;
  let activePointerId = null;

  function onPointerDown(e) {
    if (window.innerWidth > 820) return;
    if (!isHandleOrTopZone(e, sidebar)) return;

    activePointerId = e.pointerId;
    startY = e.clientY;
    startX = e.clientX;
    startExpanded = sidebar.classList.contains('expanded');
    const sidebarHeight = sidebar.offsetHeight;
    maxTranslate = Math.max(0, sidebarHeight - 128);
    baseTranslate = startExpanded ? 0 : maxTranslate;
    isDragging = false;
  }

  function onPointerMove(e) {
    if (activePointerId === null || e.pointerId !== activePointerId) return;
    const deltaY = e.clientY - startY;
    const deltaX = e.clientX - startX;

    if (!isDragging) {
      if (Math.abs(deltaY) > 6 && Math.abs(deltaY) > Math.abs(deltaX)) {
        isDragging = true;
        sidebar.classList.add('sheet-dragging');
        try {
          e.target.setPointerCapture(e.pointerId);
        } catch (_) {}
      } else {
        return;
      }
    }

    if (e.cancelable) e.preventDefault();

    let currentTranslate = baseTranslate + deltaY;
    if (currentTranslate < 0) {
      currentTranslate = currentTranslate * 0.2;
    } else if (currentTranslate > maxTranslate) {
      currentTranslate = maxTranslate + (currentTranslate - maxTranslate) * 0.2;
    }
    sidebar.style.transform = `translateY(${currentTranslate}px)`;
  }

  function onPointerUp(e) {
    if (activePointerId === null || e.pointerId !== activePointerId) return;
    activePointerId = null;
    sidebar.classList.remove('sheet-dragging');
    sidebar.style.transform = '';

    if (isDragging) {
      const deltaY = e.clientY - startY;
      didDrag = true;
      setTimeout(() => { didDrag = false; }, 250);

      const SHEET_DRAG_THRESHOLD = 60;
      if (startExpanded) {
        if (deltaY > SHEET_DRAG_THRESHOLD) {
          closeSheet();
        } else {
          openSheet();
        }
      } else {
        if (deltaY < -SHEET_DRAG_THRESHOLD) {
          openSheet();
        } else {
          closeSheet();
        }
      }
      isDragging = false;
    }
  }

  sidebar.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove, { passive: false });
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
}

   27. KHỞI CHẠY

window.addEventListener('DOMContentLoaded', initMap);
